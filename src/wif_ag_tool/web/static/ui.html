    el("button", {
      onclick: () => commitPlatoon(customInput.value),
    }, "Add"),
    el("button", { class: "ghost", onclick: closePlatoonPicker }, "Cancel"),
  ));

  backdrop.appendChild(picker);
  return backdrop;
}

function renderReplicaGroup(group, gi) {
  const rgKey = `${state.activeSlug}::group::${gi}`;
  const rgCollapsed = state.replicaCollapsedGroups.has(rgKey);

  const section = el("div", {
    class: "replica-group",
    ondragover: e => { e.preventDefault(); },
    ondrop: e => {
      const raw = e.dataTransfer.getData("text/plain");
      if (raw.startsWith("g:")) {
        e.preventDefault();
        const fgi = Number(raw.slice(2));
        if (fgi === gi) return;
        const moved = state.replicaGroups.splice(fgi, 1)[0];
        state.replicaGroups.splice(gi > fgi ? gi - 1 : gi, 0, moved);
        markReplicaDirty();
        render();
      } else if (raw.startsWith("p:")) {
        e.preventDefault();
        const [, fgiStr, fpiStr] = raw.split(":");
        const fgi = Number(fgiStr), fpi = Number(fpiStr);
        if (fgi === gi) return; // same-group reorder handled by inner platoon-card handler
        const moved = state.replicaGroups[fgi].platoons.splice(fpi, 1)[0];
        state.replicaGroups[gi].platoons.push(moved);
        markReplicaDirty();
        render();
      }
    },
  });

  // Group header
  const groupHead = el("div", {
    class: "replica-group-head",
    style: "cursor: pointer; user-select: none;",
    draggable: "true",
    ondragstart: e => { e.dataTransfer.setData("text/plain", `g:${gi}`); e.stopPropagation(); },
    ondragover: e => { e.preventDefault(); },
    ondrop: e => {
      const raw = e.dataTransfer.getData("text/plain");
      if (!raw.startsWith("g:")) return;
      e.preventDefault();
      e.stopPropagation();
      const fgi = Number(raw.slice(2));
      if (fgi === gi) return;
      const moved = state.replicaGroups.splice(fgi, 1)[0];
      state.replicaGroups.splice(gi > fgi ? gi - 1 : gi, 0, moved);
      markReplicaDirty();
      render();
    },
    onclick: e => {
      if (e.target.closest("select") || e.target.closest("button")) return;
      if (rgCollapsed) {
        state.replicaCollapsedGroups.delete(rgKey);
      } else {
        state.replicaCollapsedGroups.add(rgKey);
      }
      render();
    }
  },
    el("span", { style: "display: flex; align-items: center; gap: 6px;" },
      el("span", { class: "drag-handle", title: "Drag to reorder group", style: "font-size:13px;" }, "⋮⋮"),
      el("span", { style: "font-size: 8px; color: #778; width: 10px; display: inline-block;" }, rgCollapsed ? "▶" : "▼"),
      el("span", {}, `⬥ Combat Group: `),
      mkSelect(getAvailableGroups(), group.name, v => { group.name = v; markReplicaDirty(); render(); }, val => {
        if (!state.vanilla || !state.vanilla.combat_groups) return val;
        const deckShort = state.activeDeck.replace("Descriptor_Deck_pion_", "");
        const baseDeck = deckShort.replace(/_\d+$/, "");
        const cg = state.vanilla.combat_groups.find(cg => {
          let clean = cg.name.replace("Descriptor_CombatGroup_pion_", "").replace("Descriptor_CombatGroup_", "");
          if (clean.startsWith(deckShort + "_")) {
            clean = clean.slice(deckShort.length + 1);
          } else if (clean.startsWith(baseDeck + "_")) {
            clean = clean.slice(baseDeck.length + 1);
          }
          const parts = clean.split("_");
          const first = parts[0] || "";
          if (val.includes("_")) {
            const vParts = val.split("_");
            return parts[0] === vParts[0] && parts[1] === vParts[1];
          } else {
            return first === val;
          }
        });
        return cg ? getFriendlyCGName(cg.name) : val;
      }),
    ),
    el("span", { style: "display:flex; gap:6px; align-items:center;" },
      el("span", { class: "hint" }, `${group.platoons.reduce((s,p) => s + p.units.length, 0)} units`),
      el("button", { class: "x-btn", title: "Duplicate group",
        onclick: e => { e.stopPropagation(); copyCombatGroup(gi); } }, "⎘"),
      el("button", { class: "x-btn", title: "Remove group",
        onclick: () => {
          if (group.platoons.some(p => p.units.length > 0) && !confirm(`Delete group "${group.name}" and all its units?`)) return;
          state.replicaGroups.splice(gi, 1);
          markReplicaDirty();
          render();
        } }, "✕"),
    ),
  );
  section.appendChild(groupHead);

  if (!rgCollapsed) {
    // Group body — platoons
    const body = el("div", { class: "replica-group-body" });
    group.platoons.forEach((platoon, pi) => {
      body.appendChild(renderReplicaPlatoon(platoon, gi, pi));
    });

    // Add platoon button
    body.appendChild(el("div", { class: "group-actions" },
      el("button", { class: "ghost", style: "font-size:11px; padding:3px 8px;",
        onclick: () => addPlatoon(gi) }, "+ Add Platoon"),
    ));
    section.appendChild(body);
  }

  return section;
}

      const moved = state.replicaGroups[fgi].platoons.splice(fpi, 1)[0];
      const insertAt = (fgi === gi && pi > fpi) ? pi - 1 : pi;
      state.replicaGroups[gi].platoons.splice(insertAt, 0, moved);

    },

  const expandIcon = rpCollapsed ? "▶ " : "▼ ";

  // Platoon header
  card.appendChild(el("div", {
    class: "replica-platoon-head",
    style: "cursor: pointer; user-select: none;",
    draggable: "true",
    ondragstart: e => { e.dataTransfer.setData("text/plain", `p:${gi}:${pi}`); e.stopPropagation(); },
    ondragover: e => { e.preventDefault(); },
    ondrop: e => {
      const raw = e.dataTransfer.getData("text/plain");
      if (!raw.startsWith("p:")) return;
      e.preventDefault();
      e.stopPropagation();
      const [, fgiStr, fpiStr] = raw.split(":");
      const fgi = Number(fgiStr), fpi = Number(fpiStr);
      if (fgi === gi && fpi === pi) return;
      const moved = state.replicaGroups[fgi].platoons.splice(fpi, 1)[0];
      const insertAt = (fgi === gi && pi > fpi) ? pi - 1 : pi;
      state.replicaGroups[gi].platoons.splice(insertAt, 0, moved);
      markReplicaDirty();
      render();
    },

      if (e.target.closest("button")) return;
      if (rpCollapsed) {

        state.replicaCollapsedPlatoons.add(rpKey);

  },

      el("span", { class: "drag-handle", title: "Drag to reorder platoon", style: "font-size:12px;" }, "⋮⋮"),
      el("span", {}, `${expandIcon}${platoon.name}`),
    ),
    el("span", { style: "display:flex; gap:6px; align-items:center;" },
      el("span", { class: "hint" }, `${platoon.units.length} unit(s)`),

          state.replicaGroups[gi].platoons.splice(pi, 1);

function renderReplicaRow(row, gi, pi, ui) {
  const units = state.replicaGroups[gi].platoons[pi].units;
  const uInfo = state.unitsIndex[row.unit_id];
  const role = getNormalizedRole(uInfo);

  // Helper to make a vertically aligned label + control block
  const mkControlGroup = (label, control) => el("div", {
    style: "display: flex; flex-direction: column; gap: 2px; align-items: flex-start;"
  },
    el("span", { class: "field-label", style: "font-size: 8px; color: #8aa; text-transform: uppercase;" }, label),
    control
  );

  const node = el("div", {
    class: "replica-row",
    draggable: "true",
    "data-unit-id": row.unit_id,
    ondragstart: e => { e.dataTransfer.setData("text/plain", `u:${gi}:${pi}:${ui}`); node.classList.add("dragging"); e.stopPropagation(); },
    ondragend: () => node.classList.remove("dragging"),
    ondragover: e => { e.preventDefault(); },
    ondrop: e => {
      const raw = e.dataTransfer.getData("text/plain");
      if (!raw.startsWith("u:")) return;
      e.preventDefault();
      e.stopPropagation();
      const parts = raw.slice(2).split(":");
      if (parts.length === 3) {
        const [fgi, fpi, fui] = parts.map(Number);
        if (fgi === gi && fpi === pi && fui !== ui) {
          // Reorder within same platoon
          const moved = units.splice(fui, 1)[0];
          units.splice(ui > fui ? ui - 1 : ui, 0, moved);
        } else if (fgi !== gi || fpi !== pi) {
          // Move between platoons — but only if no existing unit with same id in target platoon
          const srcUnits = state.replicaGroups[fgi].platoons[fpi].units;
          const moving = srcUnits[fui];
          if (units.some(u => u.unit_id === moving.unit_id)) return;
          srcUnits.splice(fui, 1);
          units.splice(ui, 0, moving);
        }
        markReplicaDirty();
        render();
      }
    },
  },
    // Head: drag handle + unit thumbnail/name + delete button
    el("div", { class: "replica-row-head" },
      el("span", { class: "drag-handle" }, "⋮⋮"),
      el("span", { class: "unit-line", style: "flex: 1; min-width: 0;" },

          el("img", { class: "unit-thumb", src: `/api/unit_icon/${row.unit_id}`,
            loading: "lazy", onerror: e => { e.target.style.display = "none"; } }),
        ),
        el("span", { class: "name", style: "display: flex; align-items: center; flex-wrap: wrap;" },
          unitDisplay(row.unit_id),
          uInfo ? el("span", {
            class: `src-pill src-${uInfo.source || "wif"}`,
            title: (uInfo.source === "vanilla") ? "Vanilla unit (shipped with WARNO)" : `${modTag()} unit`
          }, (uInfo.source === "vanilla") ? "V" : modTag()) : null,
          renderSpecialtyBadges(uInfo?.specialties, uInfo?.role)
        ),
        !unitResolved(row.unit_id)
          ? el("span", { class: "warn-mark", title: "Localisation token missing" }, "⚠") : null,
      ),
      el("button", { class: "x-btn", style: "margin-left: auto;", title: "Remove",
        onclick: () => { units.splice(ui, 1); markReplicaDirty(); render(); } }, "✕")
    ),
    // Controls: XP, Count, ATK override, DEF override, Transport (if infantry)
    el("div", { class: "replica-row-controls" },
      mkControlGroup("XP", mkSelect(["1","2","3"], String(row.xp ?? 1), v => { row.xp = parseInt(v, 10); markReplicaDirty(); })),
      mkControlGroup("n", mkInput(row.count ?? 1, 1, v => { row.count = parseInt(v, 10) || 1; markReplicaDirty(); })),
      mkControlGroup("ATK", mkInput(row.attack_override ?? "", null, v => { row.attack_override = v === "" ? null : parseInt(v, 10); markReplicaDirty(); }, "auto")),
      mkControlGroup("DEF", mkInput(row.defense_override ?? "", null, v => { row.defense_override = v === "" ? null : parseInt(v, 10); markReplicaDirty(); }, "auto")),
      needsTransport(uInfo) ? mkControlGroup("Transport", mkSearchableSelect(
        ["(None)", ...getAllTransports().map(t => t.name)],
        row.transport_id || "(None)",
        v => { row.transport_id = v === "(None)" ? null : v; markReplicaDirty(); },
        name => {
          if (name === "(None)") return "(None)";
          const u = state.unitsIndex[name];
          const tag = u && u.source === "vanilla" ? "[V]" : `[${modTag()}]`;
          const isRecon = u && getNormalizedRole(u) === "recon";
          const reconTag = isRecon ? " [RECON]" : "";
          return `${tag}${reconTag} ${unitDisplay(name)}`;
        },
        uInfo ? uInfo.nation : null
      )) : null
    )
  );
  return node;
}

const mkSearchableSelect = (opts, val, onchange, labelFn, defaultNation) => {
  const container = el("div", { class: "searchable-select" });
  const valToLabel = new Map();
  const labelToVal = new Map();
  for (const o of opts) {
    const label = labelFn ? labelFn(o) : o;
    valToLabel.set(o, label);
    labelToVal.set(label, o);
  }
  const currentLabel = valToLabel.get(val) || "";

  // Category classification helper
  function getTransportCategory(o) {
    if (o === "(None)") return "none";
    const u = state.unitsIndex[o];
    if (!u) return "other";
    const name = o.toLowerCase();
    const role = (u.role || "").toLowerCase();
    
    if (role.includes("helo") || role.includes("heli") || name.includes("helo") || name.includes("heli") || name.includes("knight") || name.includes("chinook") || name.includes("stallion") || name.includes("mi_") || name.includes("mi8") || name.includes("mi24") || name.includes("mi2")) {
      return "heli";
    }
    if (role.includes("armor") || role.includes("tank") || name.includes("abrams") || name.includes("t80") || name.includes("t72") || name.includes("t64") || name.includes("t55") || name.includes("leopard")) {
      return "tank";
    }
    if (name.includes("bradley") || name.includes("bmp") || name.includes("marder") || role === "ifv") {
      return "ifv";
    }
    if (name.includes("apc") || name.includes("m113") || name.includes("btr") || name.includes("mtlb") || name.includes("fuchs") || name.includes("vab") || name.includes("tpz") || role.includes("apc")) {
      return "apc";
    }
    if (name.includes("uaz") || name.includes("humvee") || name.includes("m1025") || name.includes("iltis") || name.includes("truck") || name.includes("ural") || name.includes("kraz") || name.includes("cargo") || name.includes("jeep") || name.includes("car") || name.includes("lmtv") || name.includes("hemtt")) {
      return "truck";
    }
    return "other";
  }

  // Extract represented nations from available transports
  const nationsPresent = new Set();
  for (const o of opts) {
    if (o === "(None)") continue;
    const u = state.unitsIndex[o];
    if (u && u.nation) {
      nationsPresent.add(u.nation);
    }
  }
  const sortedNations = Array.from(nationsPresent).sort();

  let activeCategory = "all"; // "all" | "truck" | "apc" | "ifv" | "heli" | "tank" | "other"
  let activeSource = "all";   // "all" | "wif" | "vanilla"
  let activeNation = defaultNation || "all";

  const input = el("input", {
    type: "text",
    value: currentLabel,
    placeholder: "Search transport...",
    style: "background: #1f2228 url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E') no-repeat right 6px center; background-size: 8px auto;",
    onfocus: e => {
      e.target.value = "";
      renderDropdown(e.target.value);
    },
    onblur: e => {
      setTimeout(() => {
        const drop = document.getElementById("global-searchable-select-dropdown");
        if (drop) drop.remove();
        input.value = valToLabel.get(val) || "";
      }, 200);
    },
    oninput: e => {
      renderDropdown(e.target.value);
    }
  });
  container.appendChild(input);

  function renderDropdown(filterText) {
    let drop = document.getElementById("global-searchable-select-dropdown");
    if (!drop) {
      drop = el("div", { id: "global-searchable-select-dropdown", class: "searchable-select-dropdown" });
      document.body.appendChild(drop);
    }
    drop.innerHTML = "";

    // Position dropdown dynamically relative to the input field
    const rect = input.getBoundingClientRect();
    const dropdownHeightExpected = 340; // The max expected height of our dropdown
    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;

    if (spaceBelow < dropdownHeightExpected && spaceAbove > spaceBelow) {
      drop.style.bottom = `${window.innerHeight - rect.top}px`;
      drop.style.top = "auto";
    } else {
      drop.style.top = `${rect.bottom}px`;
      drop.style.bottom = "auto";
    }
    drop.style.left = `${Math.max(10, rect.right - 350)}px`;

    // 1. Build Filter Bar
    const filterBar = el("div", { class: "dropdown-filter-bar" });
    
    // Category Row
    const catRow = el("div", { class: "dropdown-filter-row" },
      el("span", { class: "filter-label" }, "Type")
    );
    const categories = [
      { id: "all", label: "All" },
      { id: "truck", label: "Jeep/Trsp" },
      { id: "apc", label: "APC" },
      { id: "ifv", label: "IFV" },
      { id: "heli", label: "Heli" },
      { id: "tank", label: "Tank" }
    ];
    for (const cat of categories) {
      const btn = el("button", {
        class: `filter-btn${activeCategory === cat.id ? " active" : ""}`,
        onmousedown: e => {
          e.preventDefault();
          activeCategory = cat.id;
          renderDropdown(input.value);
        }
      }, cat.label);
      catRow.appendChild(btn);
    }
    filterBar.appendChild(catRow);

    // Nation Row
    if (sortedNations.length > 0) {
      const natRow = el("div", { class: "dropdown-filter-row" },
        el("span", { class: "filter-label" }, "Nation")
      );
      const nationsList = ["all", ...sortedNations];
      for (const nat of nationsList) {
        const btn = el("button", {
          class: `filter-btn${activeNation === nat ? " active" : ""}`,
          onmousedown: e => {
            e.preventDefault();
            activeNation = nat;
            renderDropdown(input.value);
          }
        }, nat === "all" ? "All" : nat);
        natRow.appendChild(btn);
      }
      filterBar.appendChild(natRow);
    }

    // Source Row
    const srcRow = el("div", { class: "dropdown-filter-row" },
      el("span", { class: "filter-label" }, "Source")
    );
    const sources = [
      { id: "all", label: "All" },
      { id: "wif", label: "WIF" },
      { id: "vanilla", label: "Vanilla" }
    ];
    for (const src of sources) {
      const btn = el("button", {
        class: `filter-btn${activeSource === src.id ? " active" : ""}`,
        onmousedown: e => {
          e.preventDefault();
          activeSource = src.id;
          renderDropdown(input.value);
        }
      }, src.label);
      srcRow.appendChild(btn);
    }
    filterBar.appendChild(srcRow);
    drop.appendChild(filterBar);

    // 2. Build list container
    const list = el("div", { class: "searchable-select-list" });
    drop.appendChild(list);

    // Filter opts
    const lowerFilter = (filterText || "").toLowerCase();
    const filteredOpts = opts.filter(o => {
      if (o === "(None)") return true;

      // text filter
      const label = valToLabel.get(o) || "";
      if (!label.toLowerCase().includes(lowerFilter)) {
        return false;
      }

      const u = state.unitsIndex[o];
      if (!u) return false;

      // category filter
      if (activeCategory !== "all") {
        const uCat = getTransportCategory(o);
        if (uCat !== activeCategory) return false;
      }

      // source filter
      if (activeSource !== "all") {
        const uSource = u.source;
        if (uSource !== activeSource) return false;
      }

      // nation filter
      if (activeNation !== "all") {
        const uNat = u.nation;
        const targetNat = activeNation;
        const matches = (unation, targetNation) => {
          if (unation === targetNation) return true;
          if (unation === "DDR" && targetNation === "RDA") return true;
          if (unation === "RDA" && targetNation === "DDR") return true;
          return false;
        };
        if (!matches(uNat, targetNat)) return false;
      }

      return true;
    });

    if (filteredOpts.length === 0) {
      list.appendChild(el("div", { class: "searchable-select-option hint", style: "cursor:default; color:#777;" }, "No matches"));
      return;
    }

    for (const o of filteredOpts) {
      const label = valToLabel.get(o) || "";
      const isSelected = o === val;
      const optEl = el("div", {
        class: `searchable-select-option${isSelected ? " selected" : ""}`,
        title: label,
        onmousedown: e => {
          e.preventDefault();
          onchange(o);
          input.value = label;
          drop.remove();
        }
      }, label);
      list.appendChild(optEl);
    }
  }
  return container;
};

const mkSelect = (opts, val, onchange, labelFn) => {
  const s = el("select", { onchange: e => onchange(e.target.value) });
  for (const o of opts) {
    const label = labelFn ? labelFn(o) : o;
    const opt = el("option", { value: o }, label);
    if (o === val) opt.selected = true;
    s.appendChild(opt);
  }
  return s;
};
const mkInput = (val, min, oninput, placeholder) => el("input", {
  class: "num", type: "number",
  value: val === null || val === undefined ? "" : val,
  min: min === null ? false : min,
  placeholder: placeholder || "",
  oninput: e => oninput(e.target.value),
});

// ── draggable modals (in-memory remembered offset) ─────────────────────────
const lastModalOffset = { x: 0, y: 0 };
function makeDraggable(panel, handle) {
  if (!panel || !handle) return;
  const apply = () => { panel.style.transform = `translate(${lastModalOffset.x}px, ${lastModalOffset.y}px)`; };
  apply();
  handle.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (e.target.closest("button, input, select, textarea, a")) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const baseX = lastModalOffset.x, baseY = lastModalOffset.y;
    const onMove = ev => {
      lastModalOffset.x = baseX + (ev.clientX - startX);
      lastModalOffset.y = baseY + (ev.clientY - startY);
      apply();
    };
    const onUp = () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

function renderModal() {
  const dn = state.activeDeck ? state.activeDeck.split("_")[3] : "";

  const targetPlatoon = tgt ? state.replicaGroups[tgt.groupIdx]?.platoons[tgt.platoonIdx] : null;

    onclick: e => { if (e.target === backdrop) closeModal(); } });

  const modal = el("div", { class: "modal" });
  const modalHead = el("div", { class: "modal-head" },
    el("h3", {}, `Add ${modTag()} unit → ${deckShort(state.activeDeck || "")}`),
    el("button", { class: "ghost", onclick: closeModal }, "Done"),
  );
  modal.appendChild(modalHead);
  makeDraggable(modal, modalHead);

  const filters = el("div", { class: "modal-filters" });
  const f = state.modalFilters;
  filters.appendChild(el("span", { class: "field-label" }, "Source"));
  filters.appendChild(mkSelect(["all", "wif", "vanilla"], f.source || "all",
    v => { f.source = v; reloadModalUnits(); },
    v => v === "wif" ? modTag() : v));
  filters.appendChild(el("span", { class: "field-label" }, "Nation"));
  filters.appendChild(mkSelect(["", ...NATIONS], f.nation, v => { f.nation = v; reloadModalUnits(); }));
  filters.appendChild(el("span", { class: "field-label" }, "Role"));
  filters.appendChild(mkSelect(ROLES, f.role, v => { f.role = v; reloadModalUnits(); }));
  const search = el("input", { id: "modal-search-input", type: "text", placeholder: "search (e.g. Abrams)", value: f.q,
    oninput: e => { f.q = e.target.value; reloadModalUnits(); } });
  filters.appendChild(search);
  if (dn && f.nation === "") {
    filters.appendChild(el("button", { class: "ghost",
      onclick: () => { f.nation = dn; reloadModalUnits(); } }, `quick: ${dn}`));
  }
  modal.appendChild(filters);

  const body = el("div", { class: "modal-body" });
  if (state.modalUnits.length === 0) {
    body.appendChild(el("div", { class: "pad hint" }, "No matches. Loosen the filters."));
  }
  for (const u of state.modalUnits) {
    const row = el("div", { class: "modal-row", "data-unit-id": u.name },
      el("span", { class: `unit-thumb-container role-${getNormalizedRole(u)}` },
        el("img", { src: `/api/unit_icon/${u.name}`, loading: "lazy", onerror: e => { e.target.style.display = "none"; } }),
      ),
      el("span", {},
        u.display_name || u.name,
        u.display_resolved === false ? el("span", { class: "warn-mark", title: "Localisation token missing" }, "⚠") : null,
        el("span", {
          class: `src-pill src-${u.source || "wif"}`,
          title: (u.source === "vanilla") ? "Vanilla unit (shipped with WARNO)" : `${modTag()} unit`
        }, (u.source === "vanilla") ? "V" : modTag()),
        isCommandRole(u) ? el("span", { class: "hq-pill", title: "Command / HQ variant" }, "HQ") : null,
        renderSpecialtyBadges(u.specialties, u.role),
      ),
      el("span", { class: "hint" }, `A:${u.attack}`),
      el("span", { class: "hint" }, `D:${u.defense}`),
      el("span", { class: "hint" }, u.role || ""),
      added.has(u.name)
        ? el("span", { class: "added" }, "in platoon")
        : el("button", { onclick: () => addUnitToReplica(u) }, "Add"),
    );
    body.appendChild(row);
  }
  modal.appendChild(body);

  modal.appendChild(el("div", { class: "modal-foot" },
    el("span", { class: "hint" }, `${countTotalUnits()} unit(s) in this replica`),
    state.modalTarget ? el("span", { class: "hint" }, `→ adding to: ${state.replicaGroups[state.modalTarget.groupIdx]?.name || "?"} / ${state.replicaGroups[state.modalTarget.groupIdx]?.platoons[state.modalTarget.platoonIdx]?.name || "?"}`) : null,
    el("span", { class: "spacer" }, ""),
    el("button", { class: "ghost", onclick: closeModal }, "Done"),
  ));

  backdrop.appendChild(modal);
  return backdrop;
}

function openTacticalStatsManager() {
  state.statsManagerOpen = true;
  state.statsManagerSelectedId = null;
  state.statsEditorData = null;

  render();
}


function selectStatsManagerUnit(unitId) {
  state.statsManagerSelectedId = unitId;
  state.statsEditorData = null;
  render();
  
  fetch(`/api/units/${unitId}/tactical_stats`)
    .then(r => {
      if (!r.ok) throw new Error("failed to fetch stats");
      return r.json();
    })
    .then(data => {
      if (state.statsManagerSelectedId === unitId) {
        state.statsEditorData = data;
        render();
      }
    })
    .catch(err => {
      alert("Failed to load tactical stats: " + err.message);
      state.statsEditorData = null;
      render();
    });
}


function getStatsManagerUnits() {
  const f = state.statsManagerFilters;
  const q = (f.q || "").toLowerCase().trim();
  const wantRole = f.role;
  const wantSource = f.source;
  const wantNation = f.nation;
  
  const matches = [];
  for (const name in state.unitsIndex) {
    const u = state.unitsIndex[name];
    if (wantNation && u.nation !== wantNation) continue;
    if (wantSource && wantSource !== "all" && u.source !== wantSource) continue;
    if (wantRole && wantRole !== "all") {
      if (wantRole === "transport") {
        if (!u.is_transport) continue;
      } else if (getNormalizedRole(u) !== wantRole) {
        continue;
      }
    }
    if (q) {
      const hay = (u.name + " " + (u.display_name || "")).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    matches.push(u);
  }
  
  matches.sort((a, b) =>
    (a.display_name || a.name).localeCompare(b.display_name || b.name)
  );
  return matches;
}


function saveTacticalStats() {
  const unitId = state.statsManagerSelectedId;
  if (!unitId) return;
  
  const payload = {
    health: null,
    max_suppression: null,
    supply_capacity: null,
    cost: null,
    armor_front: null,
    armor_sides: null,
    armor_rear: null,
    armor_top: null,
    speed: null,
    road_speed: null,
    fuel_capacity: null,
    fuel_move_duration: null,
    optics: null,
    stealth: null,
    fwd_deploy: null,
    amphibious: null,
    specialties: null,
    ammo: {}
  };
  
  const healthVal = document.getElementById("stats-health")?.value;
  if (healthVal !== undefined && healthVal.trim() !== "") payload.health = parseInt(healthVal, 10);
  
  const suppVal = document.getElementById("stats-suppression")?.value;
  if (suppVal !== undefined && suppVal.trim() !== "") payload.max_suppression = parseInt(suppVal, 10);
  
  const supplyVal = document.getElementById("stats-supply")?.value;
  if (supplyVal !== undefined && supplyVal.trim() !== "") payload.supply_capacity = parseInt(supplyVal, 10);

  const costVal = document.getElementById("stats-cost")?.value;
  if (costVal !== undefined && costVal.trim() !== "") payload.cost = parseInt(costVal, 10);

  const armorFront = document.getElementById("stats-armor_front")?.value;
  if (armorFront !== undefined && armorFront.trim() !== "") payload.armor_front = parseInt(armorFront, 10);

  const armorSides = document.getElementById("stats-armor_sides")?.value;
  if (armorSides !== undefined && armorSides.trim() !== "") payload.armor_sides = parseInt(armorSides, 10);

  const armorRear = document.getElementById("stats-armor_rear")?.value;
  if (armorRear !== undefined && armorRear.trim() !== "") payload.armor_rear = parseInt(armorRear, 10);

  const armorTop = document.getElementById("stats-armor_top")?.value;
  if (armorTop !== undefined && armorTop.trim() !== "") payload.armor_top = parseInt(armorTop, 10);

  const speedVal = document.getElementById("stats-speed")?.value;
  if (speedVal !== undefined && speedVal.trim() !== "") payload.speed = parseInt(speedVal, 10);

  const roadSpeedVal = document.getElementById("stats-road_speed")?.value;
  if (roadSpeedVal !== undefined && roadSpeedVal.trim() !== "") payload.road_speed = parseInt(roadSpeedVal, 10);

  const fuelCapVal = document.getElementById("stats-fuel_capacity")?.value;
  if (fuelCapVal !== undefined && fuelCapVal.trim() !== "") payload.fuel_capacity = parseInt(fuelCapVal, 10);

  const fuelMoveVal = document.getElementById("stats-fuel_move_duration")?.value;
  if (fuelMoveVal !== undefined && fuelMoveVal.trim() !== "") payload.fuel_move_duration = parseFloat(fuelMoveVal);

  const opticsVal = document.getElementById("stats-optics")?.value;
  if (opticsVal !== undefined && opticsVal.trim() !== "") payload.optics = parseFloat(opticsVal);

  const stealthVal = document.getElementById("stats-stealth")?.value;
  if (stealthVal !== undefined && stealthVal.trim() !== "") payload.stealth = parseFloat(stealthVal);

  const fwdDeployVal = document.getElementById("stats-fwd_deploy")?.value;
  if (fwdDeployVal !== undefined && fwdDeployVal.trim() !== "") payload.fwd_deploy = parseFloat(fwdDeployVal);

  const amphibiousVal = document.getElementById("stats-amphibious")?.checked;
  if (amphibiousVal !== undefined) payload.amphibious = amphibiousVal;

  const specs = [];
  const commonSpecs = ["_leader", "_choc", "_sf", "_reservist", "_militia", "_mp", "_resolute", "_security", "_sniper", "_mountaineer"];
  commonSpecs.forEach(spec => {
    if (document.getElementById(`spec-${spec}`)?.checked) {
      specs.push(spec);
    }
  });

  const rawSpecsVal = document.getElementById("stats-specialties-raw")?.value;
  if (rawSpecsVal) {
    rawSpecsVal.split(",").forEach(s => {
      const clean = s.trim();
      if (clean && !specs.includes(clean)) {
        specs.push(clean);
      }
    });
  }
  payload.specialties = specs;
  
  if (state.statsEditorData && state.statsEditorData.weapons) {
    state.statsEditorData.weapons.forEach(w => {
      const ammoId = w.ammo_id;
      const ammoPayload = {};
      
      const df = document.getElementById(`ammo-${ammoId}-damage_family`)?.value;
      if (df !== undefined && df.trim() !== "") ammoPayload.damage_family = df.trim();
      
      const di = document.getElementById(`ammo-${ammoId}-damage_index`)?.value;
      if (di !== undefined && di.trim() !== "") ammoPayload.damage_index = parseInt(di, 10);
      
      const maxR = document.getElementById(`ammo-${ammoId}-max_range`)?.value;
      if (maxR !== undefined && maxR.trim() !== "") ammoPayload.max_range = parseInt(maxR, 10);
      
      const minR = document.getElementById(`ammo-${ammoId}-min_range`)?.value;
      if (minR !== undefined && minR.trim() !== "") ammoPayload.min_range = parseInt(minR, 10);

      const maxRH = document.getElementById(`ammo-${ammoId}-max_range_heli`)?.value;
      if (maxRH !== undefined && maxRH.trim() !== "") ammoPayload.max_range_heli = parseInt(maxRH, 10);

      const minRH = document.getElementById(`ammo-${ammoId}-min_range_heli`)?.value;
      if (minRH !== undefined && minRH.trim() !== "") ammoPayload.min_range_heli = parseInt(minRH, 10);

      const maxRP = document.getElementById(`ammo-${ammoId}-max_range_plane`)?.value;
      if (maxRP !== undefined && maxRP.trim() !== "") ammoPayload.max_range_plane = parseInt(maxRP, 10);

      const minRP = document.getElementById(`ammo-${ammoId}-min_range_plane`)?.value;
      if (minRP !== undefined && minRP.trim() !== "") ammoPayload.min_range_plane = parseInt(minRP, 10);

      const accS = document.getElementById(`ammo-${ammoId}-accuracy_static`)?.value;
      if (accS !== undefined && accS.trim() !== "") ammoPayload.accuracy_static = parseInt(accS, 10);

      const accM = document.getElementById(`ammo-${ammoId}-accuracy_motion`)?.value;
      if (accM !== undefined && accM.trim() !== "") ammoPayload.accuracy_motion = parseInt(accM, 10);

      const aimT = document.getElementById(`ammo-${ammoId}-aiming_time`)?.value;
      if (aimT !== undefined && aimT.trim() !== "") ammoPayload.aiming_time = parseFloat(aimT);
      
      const tbs = document.getElementById(`ammo-${ammoId}-time_between_shots`)?.value;
      if (tbs !== undefined && tbs.trim() !== "") ammoPayload.time_between_shots = parseFloat(tbs);
      
      const tbsalv = document.getElementById(`ammo-${ammoId}-time_between_salvos`)?.value;
      if (tbsalv !== undefined && tbsalv.trim() !== "") ammoPayload.time_between_salvos = parseFloat(tbsalv);
      
      const sps = document.getElementById(`ammo-${ammoId}-shots_per_salvo`)?.value;
      if (sps !== undefined && sps.trim() !== "") ammoPayload.shots_per_salvo = parseInt(sps, 10);
      
      const pd = document.getElementById(`ammo-${ammoId}-physical_damages`)?.value;
      if (pd !== undefined && pd.trim() !== "") ammoPayload.physical_damages = parseFloat(pd);
      
      const sd = document.getElementById(`ammo-${ammoId}-suppress_damages`)?.value;
      if (sd !== undefined && sd.trim() !== "") ammoPayload.suppress_damages = parseFloat(sd);
      
      const sc = document.getElementById(`ammo-${ammoId}-supply_cost`)?.value;
      if (sc !== undefined && sc.trim() !== "") ammoPayload.supply_cost = parseFloat(sc);
      
      // Serialize traits
      const ammoTraits = [];
      const commonTraits = ["MOTION", "STAT", "HEAT", "HE", "KINETIC", "TANDEM", "RADAR", "autoloader", "coax", "smoke", "tripod"];
      commonTraits.forEach(t => {
        if (document.getElementById(`ammo-${ammoId}-trait-${t}`)?.checked) {
          ammoTraits.push(t);
        }
      });
      const rawAmmoTraitsVal = document.getElementById(`ammo-${ammoId}-traits-raw`)?.value;
      if (rawAmmoTraitsVal) {
        rawAmmoTraitsVal.split(",").forEach(t => {
          const clean = t.trim();
          if (clean && !ammoTraits.includes(clean)) {
            ammoTraits.push(clean);
          }
        });
      }
      
      const baseTraits = w.traits.base || [];
      const arraysEqual = ammoTraits.length === baseTraits.length && 
                          ammoTraits.every(val => baseTraits.includes(val)) &&
                          baseTraits.every(val => ammoTraits.includes(val));
      if (!arraysEqual) {
        ammoPayload.traits = ammoTraits;
      }
      
      payload.ammo[ammoId] = ammoPayload;
    });
  }
  
  fetch(`/api/units/${unitId}/tactical_stats`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  })
    .then(r => {
      if (!r.ok) throw new Error("failed to save stats");
      return r.json();
    })
    .then(() => {
      toast("Tactical stats overrides saved!");
      selectStatsManagerUnit(unitId);
      fetchTacticalSummary();
    })
    .catch(err => {
      alert("Failed to save tactical stats: " + err.message);
    });
}

function openHowto() {
  state.howtoOpen = true;
  if (state.howtoText == null && !state.howtoLoading) {
    state.howtoLoading = true;
    fetch("/api/howto", { headers: { "Accept": "text/markdown" } })
      .then(r => r.ok ? r.text() : Promise.reject(new Error("HTTP " + r.status)))
      .then(t => { state.howtoText = t; state.howtoLoading = false; render(); })
      .catch(e => {
        state.howtoText = "# Failed to load HOWTO.md\n\n" + (e.message || String(e)) +

        render();
      });
  }
  render();
}

// Minimal markdown → HTML for the subset HOWTO.md actually uses.
// Handles: ATX headings, fenced code blocks, inline code, bold, italic,
// blockquotes, unordered + ordered lists, pipe tables, horizontal rules,
// links, and paragraph wrapping. Not a general-purpose renderer; kept small
// on purpose so the SPA stays dependency-free.
function mdToHtml(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => {
    // Inline code first so its contents are protected from other rules.
    const codeSlots = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => {
      codeSlots.push(c);
      return `␀${codeSlots.length - 1}␀`;
    });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/␀(\d+)␀/g, (_, i) => `<code>${esc(codeSlots[+i])}</code>`);
    return s;
  };

  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  let inUl = false, inOl = false;
  const closeLists = () => {
    if (inUl) { out.push("</ul>"); inUl = false; }
    if (inOl) { out.push("</ol>"); inOl = false; }
  };

  while (i < lines.length) {
    const line = lines[i];

    // Fenced code block
    if (/^```/.test(line)) {
      closeLists();
      i++;
      const buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; // skip closing fence
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }

    // Horizontal rule
    if (/^---+\s*$/.test(line)) {
      closeLists();
      out.push("<hr>");
      i++;
      continue;
    }

    // Heading
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      closeLists();
      out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
      i++;
      continue;
    }

    // Table (GFM-ish: header | header followed by ---|---)
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      closeLists();
      const splitRow = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const headers = splitRow(line);
      i += 2; // skip header + separator
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        rows.push(splitRow(lines[i]));
        i++;
      }
      let html = "<table><thead><tr>" + headers.map(h => `<th>${inline(h)}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of rows) html += "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      html += "</tbody></table>";
      out.push(html);
      continue;
    }

    // Blockquote
    if (/^>\s?/.test(line)) {
      closeLists();
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);
      continue;
    }

    // Unordered list item
    const ulm = /^[-*]\s+(.*)$/.exec(line);
    if (ulm) {
      if (inOl) { out.push("</ol>"); inOl = false; }
      if (!inUl) { out.push("<ul>"); inUl = true; }
      out.push(`<li>${inline(ulm[1])}</li>`);
      i++;
      continue;
    }

    // Ordered list item
    const olm = /^\d+\.\s+(.*)$/.exec(line);
    if (olm) {
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (!inOl) { out.push("<ol>"); inOl = true; }
      out.push(`<li>${inline(olm[1])}</li>`);
      i++;
      continue;
    }

    // Blank line: paragraph break
    if (line.trim() === "") {
      closeLists();
      i++;
      continue;
    }

    // Default: paragraph (accumulate until blank line or block-level start)
    closeLists();
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" &&
           !/^(#{1,6}\s|>\s|[-*]\s|\d+\.\s|```|---+\s*$)/.test(lines[i])) {
      buf.push(lines[i]);
      i++;
    }
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  closeLists();
  return out.join("\n");
}

// ── actions ─────────────────────────────────────────────────────────────────

async function bootstrapPicker() {
  try {
    const [sessions, campaigns] = await Promise.all([
      api("GET", "/sessions"),
      api("GET", "/campaigns"),
    ]);
    state.sessions = sessions;
    state.campaigns = campaigns;
  } catch (e) { toast("Failed to load picker: " + e.message, true); }
  render();
}

async function openSession(slug) {
  state.loadingSession = true;
  state.loadingStep = 0;
  state.loadingText = "Initializing campaign connection...";
  render();

  const ticker = setInterval(() => {
    if (!state.loadingSession) {
      clearInterval(ticker);
      return;
    }
    const steps = [
      "Accessing WIF campaign storage",
      "Loading game database & NDF cache",
      "Parsing mod parameters & values",
      "Reading localized string mappings",
      "Caching unit attributes & decks",
      "Compiling tactical statistics",
      "Optimizing card rendering assets",
      "Readying interface viewports"
    ];
    state.loadingStep = Math.min(state.loadingStep + 1, steps.length - 1);
    state.loadingText = steps[state.loadingStep] + "...";
    render();
  }, 900);

  try {
    state.unitsIndex = {};
    const session = await api("GET", `/sessions/${slug}`);
    state.session = session;
    state.activeSlug = slug;
    state.activeDeck = null;
    state.vanilla = null;
    state.replicaGroups = [];
    state.initialReplica = "[]";
    state.initialScope = [...(session.nation_scope || [])];
    state.replicaDirty = false;
    state.sessionDirty = false;
    state.view = "session";
    state.lastScrollLeft = 0;
    state.lastScrollCenter = 0;
    state.lastScrollRight = 0;
    loadCollapseState();
    await reloadScopedDecks();
    fetchTacticalSummary();
  } catch (e) {
    toast("Open failed: " + e.message, true);
  } finally {
    clearInterval(ticker);
    state.loadingSession = false;
    render();
  }
}

async function fetchTacticalSummary() {
  try {
    const summary = await api("GET", "/tactical_stats/summary");
    state.tacticalSummary = summary;
    render();
  } catch (e) {
    console.error("Failed to load tactical stats summary", e);
  }
}

async function openOrCreateForCampaign(c) {
  // If a session for this slug already exists, open it; else create new.
  const existing = state.sessions.find(s => s.slug === c.slug);
  if (existing) return openSession(existing.slug);
  try {
    const created = await api("POST", "/sessions", {
      campaign: c.campaign,
      factions: c.factions_from_save,
      missions: c.missions_seen,
      slug: c.slug,
    });
    state.sessions.unshift(created);
    return openSession(created.slug);
  } catch (e) { toast("Create failed: " + e.message, true); }
}

async function promptNewSession() {
  const name = prompt("Campaign name?");
  if (!name) return;
  const factionStr = prompt("Factions (comma-separated, e.g. US,SOV)") || "";
  const factions = factionStr.split(",").map(s => s.trim()).filter(Boolean);
  try {
    const created = await api("POST", "/sessions", { campaign: name, factions });
    state.sessions.unshift(created);
    openSession(created.slug);
  } catch (e) { toast("Create failed: " + e.message, true); }
}

async function deleteSession(slug) {
  if (!confirm("Delete this session? Replicas are kept (they're global).")) return;
  try {
    await api("DELETE", `/sessions/${slug}`);
    state.sessions = state.sessions.filter(s => s.slug !== slug);
    render();
  } catch (e) { toast("Delete failed: " + e.message, true); }
}

function backToPicker() {
  if (state.replicaDirty && !confirm("Unsaved deck edits will be lost. Continue?")) return;
  if (state.sessionDirty && !confirm("Unsaved session changes will be lost. Continue?")) return;
  state.replicaGroups = [];
  state.initialReplica = "[]";
  state.view = "picker";
  state.session = null;
  state.activeSlug = null;
  state.vanillaCollapsedGroups.clear();
  state.vanillaCollapsedSmartGroups.clear();
  state.replicaCollapsedGroups.clear();
  state.replicaCollapsedPlatoons.clear();
  bootstrapPicker();
}

function toggleNation(n, on) {
  const scope = new Set(state.session.nation_scope || []);
  if (on) scope.add(n); else scope.delete(n);
  state.session.nation_scope = Array.from(scope);
  state.sessionDirty = !arraysEq(state.session.nation_scope, state.initialScope);
  reloadScopedDecks();
}

const arraysEq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

async function reloadScopedDecks() {
  try {
    const nations = (state.session.nation_scope || []).join(",");
    state.decks = await api("GET", `/sessions/${state.activeSlug}/decks?nations=${nations}`);
  } catch (e) { toast("Failed to load decks: " + e.message, true); state.decks = []; }
  render();
}

async function selectDeck(name) {
  if (state.replicaDirty && !confirm("Switch deck and lose unsaved WIF edits?")) return;
  if (window.innerWidth < 1200) {
    state.leftPaneOpen = false;
  }
  state.activeDeck = name;
  state.vanilla = null;
  state.replicaGroups = [];
  state.initialReplica = "[]";
  state.replicaDirty = false;
  state.lastScrollCenter = 0;
  state.lastScrollRight = 0;
  render();
  try {
    const [v, r] = await Promise.all([
      api("GET", `/decks/${name}/vanilla`),
      api("GET", `/decks/${name}/replica`),
    ]);
    state.vanilla = v;
    // Load hierarchical groups, falling back to empty
    if (r.groups && r.groups.length > 0) {
      state.replicaGroups = JSON.parse(JSON.stringify(r.groups));
    } else if (r.units && r.units.length > 0) {
      // Legacy flat format — convert on the fly
      const gmap = {};
      for (const u of r.units) {
        const gn = u.group_name || "A";
        const pn = u.sub_group || "Default";
        if (!gmap[gn]) gmap[gn] = {};
        if (!gmap[gn][pn]) gmap[gn][pn] = [];
        gmap[gn][pn].push({ unit_id: u.unit_id, xp: u.xp || 1, count: u.count || 1,
          attack_override: u.attack_override || null, defense_override: u.defense_override || null,
          transport_id: u.transport_id || null });
      }
      state.replicaGroups = Object.keys(gmap).sort().map(gn => ({
        name: gn,
        platoons: Object.keys(gmap[gn]).sort().map(pn => ({ name: pn, units: gmap[gn][pn] }))
      }));
    } else {
      state.replicaGroups = [];
    }
    state.initialReplica = JSON.stringify(state.replicaGroups);
    state.replicaDirty = false;
  } catch (e) { toast("Failed: " + e.message, true); }
  render();
}

function markReplicaDirty() {
  state.replicaDirty = JSON.stringify(state.replicaGroups) !== state.initialReplica;
  render();
}

async function saveDeckReplica() {
  if (countTotalUnits() === 0) { toast("Use the ✕ on the left to delete the replica instead.", true); return; }
  try {
    await api("PUT", `/decks/${state.activeDeck}/replica`, { groups: state.replicaGroups });
    state.initialReplica = JSON.stringify(state.replicaGroups);
    state.replicaDirty = false;
    toast("Replica saved.");
    await reloadScopedDecks();
  } catch (e) { toast("Save failed: " + e.message, true); }
}

async function deleteReplica(deck) {
  if (!confirm("Delete the WIF replica for this deck? Affects every session that references it.")) return;
  try {
    await api("DELETE", `/decks/${deck}/replica`);
    if (state.activeDeck === deck) {
      state.replicaGroups = [];
      state.initialReplica = "[]";
      state.replicaDirty = false;
    }
    await reloadScopedDecks();
    toast("Replica deleted.");
  } catch (e) { toast("Delete failed: " + e.message, true); }
}

async function doSaveSession() {
  try {
    let savedSession = false;
    let savedReplica = false;

    if (state.replicaDirty) {
      if (countTotalUnits() === 0) {
        toast("Cannot save empty replica via Save Session. Use the ✕ on the left to delete it instead.", true);
        return;
      }
      await api("PUT", `/decks/${state.activeDeck}/replica`, { groups: state.replicaGroups });
      state.initialReplica = JSON.stringify(state.replicaGroups);
      state.replicaDirty = false;
      savedReplica = true;
    }

    if (state.sessionDirty) {
      const saved = await api("PATCH", `/sessions/${state.activeSlug}`, {
        nation_scope: state.session.nation_scope,
      });
      state.session = saved;
      state.initialScope = [...(saved.nation_scope || [])];
      state.sessionDirty = false;
      savedSession = true;
    }

    if (savedSession && savedReplica) {
      toast("Session and active deck replica saved.");
    } else if (savedSession) {
      toast("Session saved.");
    } else if (savedReplica) {
      toast("Active deck replica saved.");
    }

    await reloadScopedDecks();
  } catch (e) {
    toast("Save failed: " + e.message, true);
  }
}

async function doExtractSession() {
  try {
    const blob = await api("POST", `/sessions/${state.activeSlug}/extract`);
    downloadBlob(blob, `wif_session_${state.activeSlug}.zip`);
  } catch (e) { toast("Extract failed: " + e.message, true); }
}

async function doRefreshDecks() {
  try {
    state.unitsIndex = {};
    await api("POST", "/refresh");
    await reloadScopedDecks();
    toast("Deck cache refreshed.");
  } catch (e) { toast("Refresh failed: " + e.message, true); }
}

async function doExport(scope) {
  try {
    const body = scope === "session"
      ? { scope: "session", session_slug: state.activeSlug }
      : { scope: "all" };
    const blob = await api("POST", "/export", body);
    downloadBlob(blob, "wif_ag_export.zip");
  } catch (e) { toast("Export failed: " + e.message, true); }
}

async function doSaveSettings(targetModDir, gameDir, exportDir, sourceModDir, modUnitPrefix, modTag, modLocFolder) {
  const pathsChanged = (targetModDir !== (state.session.target_mod_dir || "")) ||
                       (gameDir !== (state.session.game_dir || "")) ||
                       (exportDir !== (state.session.export_dir || "")) ||
                       (sourceModDir !== (state.session.source_mod_dir || "")) ||
                       (modUnitPrefix !== (state.session.mod_unit_prefix || "")) ||
                       (modTag !== (state.session.mod_tag || "")) ||
                       (modLocFolder !== (state.session.mod_loc_folder || ""));
  try {
    const saved = await api("PATCH", `/sessions/${state.activeSlug}`, {
      target_mod_dir: targetModDir,
      game_dir: gameDir,
      export_dir: exportDir,
      source_mod_dir: sourceModDir,
      mod_unit_prefix: modUnitPrefix,
      mod_tag: modTag,
      mod_loc_folder: modLocFolder,
    });
    state.session = saved;
    state.settingsOpen = false;
    toast("Settings saved successfully.");
    if (pathsChanged) {
      toast("Settings changed, refreshing catalog...");
      await doRefreshDecks();
    } else {
      render();
    }
  } catch (e) {
    toast("Save settings failed: " + e.message, true);
  }
}

async function doDirectExport() {
  const modTagVal = state.session?.mod_tag || "WIF";
  const steps = [
    "Analyzing " + modTagVal + " replicas and assignments",
    "Validating unit cache catalog",
    "Backing up original game NDFs (.orig)",
    "Generating StrategicDecks.ndf",
    "Compiling StrategicPacks.ndf",
    "Assembling StrategicCombatGroups.ndf",
    "Writing PLATOONS.csv translations",
    "Patching UniteDescriptor.ndf overrides",
    "Finalizing mod directory structure"
  ];

  // Initialize export state
  state.exportStatus = "exporting";
  state.exportStep = 0;
  state.exportText = steps[0];
  state.exportProgress = 5;
  state.exportError = null;
  render();

  // Start smooth progress simulation up to 92%
  let currentStepIdx = 0;
  const intervalId = setInterval(() => {
    if (state.exportStatus === "exporting") {
      if (currentStepIdx < steps.length - 1) {
        currentStepIdx++;
        state.exportStep = currentStepIdx;
        state.exportText = steps[currentStepIdx];
        state.exportProgress = Math.min(92, Math.round(((currentStepIdx + 1) / steps.length) * 92));
        render();
      }
    }
  }, 450);

  try {
    const res = await api("POST", `/sessions/${state.activeSlug}/export_direct`);
    clearInterval(intervalId);
    state.exportProgress = 100;
    state.exportStatus = "idle"; // Completes/closes instantly
    render();
    toast(res.message || "Direct export complete.");
  } catch (e) {
    clearInterval(intervalId);
    state.exportStatus = "fail";
    state.exportError = e.message || "Unknown error occurred.";
    render();
    toast("Export failed: " + e.message, true);
  }
}

async function doBuildMod() {
  state.buildOpen = true;
  state.buildStatus = "building";
  state.buildLog = "Triggering GenerateMod.bat...\n";
  render();

  try {
    const r = await fetch(`/api/sessions/${state.activeSlug}/build`, {
      method: "POST"
    });
    let res;
    try {
      res = await r.json();
    } catch (e) {
      res = { error: "Failed to parse API response: " + r.statusText };
    }

    if (r.ok && res.ok) {
      state.buildStatus = "success";
      let log = "GenerateMod.bat completed successfully.\n\n";
      if (res.stdout) log += "STDOUT:\n" + res.stdout + "\n";
      if (res.stderr) log += "STDERR:\n" + res.stderr + "\n";
      state.buildLog = log;
    } else {
      state.buildStatus = "fail";
      let log = "GenerateMod.bat failed.\n\n";
      if (res.error) log += "ERROR: " + res.error + "\n\n";
      if (res.stdout) log += "STDOUT:\n" + res.stdout + "\n";
      if (res.stderr) log += "STDERR:\n" + res.stderr + "\n";
      state.buildLog = log;
    }
  } catch (err) {
    state.buildStatus = "fail";
    state.buildLog = "Failed to run build: " + err.message;
  }
  render();
}

// ── modal helpers ───────────────────────────────────────────────────────────

// Kept for backwards compatibility — every filter change now re-filters the
// in-memory catalogue, so there's no async work and no debounce needed.
function debounceReload() { reloadModalUnits(); }

async function openAddModal(gi, pi) {
  if (!state.activeDeck) return;
  state.modalOpen = true;
  state.modalTarget = (gi !== undefined && pi !== undefined) ? { groupIdx: gi, platoonIdx: pi } : null;
  const dn = state.activeDeck.split("_")[3];
  // Preserve previous search, source, and role filters across modal opens.
  const prevQ = state.modalFilters?.q || "";
  const prevSource = state.modalFilters?.source || "all";
  const prevRole = state.modalFilters?.role || "all";
  state.modalFilters = { nation: dn || "", role: prevRole, q: prevQ, source: prevSource };
  // The catalogue is loaded once at page boot; if it isn't ready yet, fall back to
  // an async load so the first modal open isn't empty.
  if (Object.keys(state.unitsIndex).length === 0) {
    await loadUnitsIndex();
  }
  reloadModalUnits();
  render();
}

// Pure client-side filter against state.unitsIndex. Since the catalogue is fully
// in memory, switching Source (WIF ↔ Vanilla) doesn't reload the unit list — it
// only re-filters the same data — which is why the search box keeps its value
// when you flip the source.
function reloadModalUnits() {
  const f = state.modalFilters;
  const q = (f.q || "").toLowerCase().trim();
  const wantSource = (f.source || "all");
  const wantNation = (f.nation === "RDA") ? "DDR" : f.nation;
  const wantRole = (f.role || "all");
  const matches = [];
  for (const id in state.unitsIndex) {
    const u = state.unitsIndex[id];
    if (wantSource !== "all" && (u.source || "wif") !== wantSource) continue;
    if (wantNation && u.nation !== wantNation) continue;
    if (wantRole !== "all") {
      // "command" is a cross-cutting bucket: any hq_* role qualifies.
      if (wantRole === "command") {
        if (!isCommandRole(u)) continue;
      } else if (getNormalizedRole(u) !== wantRole) {
        continue;
      }
    }
    if (q) {
      const hay = (u.name + " " + (u.display_name || "")).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    matches.push(u);
  }
  matches.sort((a, b) =>
    (a.display_name || a.name).localeCompare(b.display_name || b.name)
  );
  state.modalUnits = matches;
  render();
}

function closeModal() { state.modalOpen = false; render(); }

function addUnitToReplica(u) {
  const target = state.modalTarget;
  if (!target || !state.replicaGroups[target.groupIdx] || !state.replicaGroups[target.groupIdx].platoons[target.platoonIdx]) {
    toast("No platoon selected — add a group and platoon first.", true);
    return;
  }
  state.replicaGroups[target.groupIdx].platoons[target.platoonIdx].units.push({
    unit_id: u.name, xp: 1, count: 1, attack_override: null, defense_override: null,
    transport_id: null,
  });
  markReplicaDirty();
}

// ── units index (WIF + vanilla) ─────────────────────────────────────────────
async function loadUnitsIndex() {
  // Idempotent: only fetch once per page load. Both endpoints return the same shape.
  // The backend tags each unit with `source` ("wif" or "vanilla") so the modal can
  // filter, badge, and search without ever re-hitting the API.
  if (Object.keys(state.unitsIndex).length > 0) return;
  try {
    const [wif, vanilla] = await Promise.all([
      api("GET", "/wif_units"),
      api("GET", "/vanilla_units"),
    ]);
    const ix = {};
    // Vanilla first, WIF second — WIF wins on the (unlikely) name collision.
    for (const u of vanilla) ix[u.name] = u;
    for (const u of wif) ix[u.name] = u;
    state.unitsIndex = ix;
    render();
  } catch (e) {
    toast("Failed to load unit catalogue: " + e.message, true);
  }
}

// ── tooltip ─────────────────────────────────────────────────────────────────
let tooltipEl = null;
let tooltipFor = null;

function ensureTooltip() {
  if (tooltipEl) return tooltipEl;
  tooltipEl = el("div", { id: "unit-tooltip", hidden: true });
  document.body.appendChild(tooltipEl);
  return tooltipEl;
}

function fillTooltip(unit_id) {
  const t = ensureTooltip();
  const u = state.unitsIndex[unit_id];
  t.innerHTML = "";
  if (!u) {
    t.appendChild(el("div", { class: "tt-head" },
      el("div", {},
        el("div", { class: "tt-name" }, unitShort(unit_id)),
        el("div", { class: "tt-id" }, unit_id + " (not in catalogue)"),
      ),
    ));
    return;
  }
  const role = getNormalizedRole(u);
  const head = el("div", { class: "tt-head" },
    el("span", { class: `unit-thumb-container role-${role} large` },
      el("img", { src: `/api/unit_icon/${unit_id}`, onerror: e => { e.target.style.display = "none"; } }),
    ),
    el("div", { style: "flex:1; min-width:0" },
      el("div", { class: "tt-name" },
        u.display_name || unitShort(unit_id),
        u.display_resolved === false ? el("span", { class: "warn-mark", title: "LOC missing" }, " ⚠") : null,
      ),
      el("div", { class: "tt-id" }, unit_id),
    ),
  );
  t.appendChild(head);
  t.appendChild(el("div", { class: "tt-row" },
    el("span", { class: "tt-chip" }, u.nation || "?"),
    el("span", { class: "tt-chip" }, u.role || "?"),
    u.xp_bonus ? el("span", { class: "tt-chip" }, `XP+${u.xp_bonus}/lvl`) : null,
  ));
  t.appendChild(el("div", { class: "tt-row" },
    el("span", { class: "tt-stat" }, "ATK ", el("b", {}, String(u.attack ?? "?"))),
    el("span", { class: "tt-stat" }, "DEF ", el("b", {}, String(u.defense ?? "?"))),
  ));
  if (u.specialties && u.specialties.length) {
    const badges = renderSpecialtyBadges(u.specialties, u.role);
    if (badges) {
      const wrap = el("div", { class: "tt-specs" });
      wrap.appendChild(badges);
      t.appendChild(wrap);
    }
  }
}

function positionTooltip(x, y) {
  const t = ensureTooltip();
  const m = 14;
  const w = t.offsetWidth || 280;
  const h = t.offsetHeight || 120;
  let left = x + m;
  let top = y + m;
  if (left + w > window.innerWidth - 8) left = x - w - m;
  if (top + h > window.innerHeight - 8) top = y - h - m;
  if (left < 4) left = 4;
  if (top < 4) top = 4;
  t.style.left = left + "px";
  t.style.top = top + "px";
}

document.addEventListener("mouseover", e => {
  const target = e.target.closest("[data-unit-id]");
  if (!target) return;
  const id = target.getAttribute("data-unit-id");
  if (!id) return;
  tooltipFor = id;
  fillTooltip(id);
  const t = ensureTooltip();
  t.hidden = false;
  positionTooltip(e.clientX, e.clientY);
  // Two-frame opacity transition so we don't flash an unstyled box.
  requestAnimationFrame(() => t.setAttribute("data-shown", "1"));
});

document.addEventListener("mousemove", e => {
  if (!tooltipFor) return;
  positionTooltip(e.clientX, e.clientY);
});

document.addEventListener("mouseout", e => {
  if (!tooltipFor) return;
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-unit-id]");
  if (to) return;  // moved between two unit rows — keep the tooltip alive
  tooltipFor = null;
  const t = ensureTooltip();
  t.removeAttribute("data-shown");
  t.hidden = true;
});

// ── init ────────────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.platoonPickerOpen) closePlatoonPicker();
  if (e.key === "Escape" && state.cloneReplicaOpen) closeCloneReplicaModal();
  if (e.key === "Escape" && state.modalOpen) closeModal();
  if (e.key === "Escape" && state.exportOpen) { state.exportOpen = false; render(); }
  if (e.key === "Escape" && state.settingsOpen) { state.settingsOpen = false; render(); }
  if (e.key === "Escape" && state.howtoOpen) { state.howtoOpen = false; render(); }
});
window.addEventListener("beforeunload", e => {
  if (state.replicaDirty || state.sessionDirty) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("unload", () => {
  // Clear state to prevent memory leaks
  state.replicaGroups = [];
  state.unitsIndex = {};
});

async function loadConfigStatus() {
  try {
    const status = await api("GET", "/status");
    state.rawFilesAvailable = !!status.raw_files_available;
    render();
  } catch (e) {
    console.warn("Failed to load status:", e);
  }
}

loadCollapseState();
bootstrapPicker();
loadUnitsIndex();
loadConfigStatus();
</script>
</body>
</html>
