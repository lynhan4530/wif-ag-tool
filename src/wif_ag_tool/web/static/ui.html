<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WIF AG Tool</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: ui-monospace, Consolas, Menlo, monospace; background:#181a1f; color:#dde; margin:0; }
  header { background:#23262d; padding:8px 12px; border-bottom:1px solid #333; display:flex; gap:8px 12px; align-items:center; flex-wrap:wrap; min-height:42px; }
  header h1 { font-size:14px; margin:0; }
  header .chip { background:#2d3340; padding:2px 8px; border-radius:10px; font-size:11px; color:#9be; }
  header .spacer { flex:1; }
  button { background:#2d4; color:#000; border:0; padding:4px 10px; font:inherit; cursor:pointer; border-radius:3px; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button.ghost { background:#3a3f4a; color:#dde; }
  button.del { background:#d44; color:#fff; }
  button.warn { background:#e8a13b; color:#000; }
  select, input { background:#1f2228; color:#dde; border:1px solid #333; padding:3px 6px; font:inherit; border-radius:2px; }
  input.num { width:64px; }

  /* picker */
  .picker { padding:24px; max-width:980px; margin:0 auto; }
  .picker h2 { font-size:12px; text-transform:uppercase; color:#8aa; letter-spacing:.1em; margin:24px 0 8px; }
  .picker .card { background:#23262d; border:1px solid #2a2d34; padding:10px 14px; margin-bottom:6px; display:flex; gap:12px; align-items:center; }
  .picker .card .grow { flex:1; }
  .picker .card .title { font-size:14px; color:#dde; }
  .picker .card .meta { font-size:11px; color:#9aa; margin-top:2px; }
  .picker .new { margin-top:18px; }

  /* session view */
  .session { display:grid; grid-template-columns: 240px 1fr 1fr; height:calc(100vh - 42px); }
  .pane { border-right:1px solid #2a2d34; overflow:auto; }
  .pane:last-child { border-right:0; }
  .pane h2 { font-size:11px; text-transform:uppercase; color:#8aa; letter-spacing:.1em; margin:0; padding:8px 12px; background:#1c1f25; border-bottom:1px solid #2a2d34; position:sticky; top:0; z-index:1; }
  .pane .pad { padding:8px 12px; }

  @media (max-width: 1100px) {
    .session { grid-template-columns: 210px 1fr 1fr; }
  }
  @media (max-width: 860px) {
    .session { grid-template-columns: 1fr; height: auto; overflow: visible; }
    .pane { border-right: none; border-bottom: 1px solid #2a2d34; height: auto; max-height: 480px; }
  }

  /* left */
  .nation-list { display:grid; grid-template-columns: 1fr 1fr; gap:2px 8px; margin-bottom:8px; font-size:12px; }
  .nation-list label { display:flex; gap:4px; align-items:center; cursor:pointer; }
  .deck-row { padding:5px 12px; cursor:pointer; display:flex; gap:6px; align-items:flex-start; border-bottom:1px solid #21232a; font-size:12px; }
  .deck-row:hover { background:#23262d; }
  .deck-row.active { background:#234; }
  .deck-row .deck-label { flex:1; min-width:0; display:flex; flex-direction:column; }
  .deck-row .deck-name { color:#dde; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck-row .deck-sub { color:#777; font-size:10px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deck-row .badge { background:#2d4; color:#000; padding:0 5px; border-radius:8px; font-size:10px; align-self:center; }
  .deck-row .ghost-x { margin-left:auto; opacity:.5; align-self:center; }
  .deck-row .ghost-x:hover { opacity:1; color:#d44; }
  .warn-mark { color:#e8a13b; font-size:10px; margin-left:4px; cursor:help; }

  /* unit thumbnails (everywhere) */
  .unit-thumb-container {
    width:32px;
    height:22px;
    background:#0c0e12;
    border:1px solid #23262d;
    flex-shrink:0;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-radius:2px;
    overflow:hidden;
  }
  .unit-thumb-container::before {
    content:"";
    position:absolute;
    width:16px;
    height:16px;
    opacity:0.35;
    background-size:contain;
    background-position:center;
    background-repeat:no-repeat;
  }
  .unit-thumb-container.large {
    width:64px;
    height:44px;
  }
  .unit-thumb-container.large::before {
    width:32px;
    height:32px;
  }
  .unit-thumb {
    width:100%;
    height:100%;
    object-fit:contain;
    position:absolute;
    top:0;
    left:0;
    z-index:1;
  }
  .unit-line { display:inline-flex; gap:6px; align-items:center; }
  .unit-line .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .hq-pill { background:#e8a13b; color:#000; padding:0 5px; border-radius:8px; font-size:9px; font-weight:bold; margin-left:6px; vertical-align:middle; }
  .src-pill { padding:0 5px; border-radius:8px; font-size:9px; font-weight:bold; margin-left:6px; vertical-align:middle; }
  .src-wif { background:#3a6; color:#000; }
  .src-vanilla { background:#586; color:#dde; }

  /* tooltip */
  #unit-tooltip {
    position:fixed; left:0; top:0; z-index:50; pointer-events:none;
    background:#1a1d22; border:1px solid #444; border-radius:4px;
    box-shadow:0 6px 18px rgba(0,0,0,.55);
    padding:10px 12px; width:280px; font-size:12px;
    transition:opacity .08s; opacity:0;
  }
  #unit-tooltip[data-shown="1"] { opacity:1; }
  #unit-tooltip .tt-head { display:flex; gap:10px; align-items:flex-start; margin-bottom:6px; }
  #unit-tooltip img { width:64px; height:44px; object-fit:contain; background:#0c0e12; border:1px solid #2a2d34; flex-shrink:0; }
  #unit-tooltip .tt-name { font-size:13px; color:#fff; font-weight:bold; }
  #unit-tooltip .tt-id { font-size:10px; color:#778; word-break:break-all; }
  #unit-tooltip .tt-row { display:flex; gap:8px; margin-top:3px; flex-wrap:wrap; }
  #unit-tooltip .tt-chip { background:#2d3340; color:#9be; padding:1px 6px; border-radius:8px; font-size:10px; }
  #unit-tooltip .tt-stat { color:#dde; }
  #unit-tooltip .tt-stat b { color:#fff; }
  #unit-tooltip .tt-specs { color:#bbb; font-size:11px; }

  /* center: vanilla tree */
  .cg { margin:6px 12px 12px; border-left:2px solid #2a2d34; padding-left:8px; }
  .cg-head { font-size:12px; color:#aaf; margin-bottom:4px; }
  .cg-head .hq { background:#e8a13b; color:#000; padding:0 5px; border-radius:8px; font-size:10px; margin-left:6px; }
  .sg { margin:2px 0 6px 6px; }
  .sg-head { font-size:11px; color:#bbb; }
  .pk { font-size:11px; color:#ccc; margin-left:14px; }
  .pk .x { color:#9bd; }

  /* tree toggle pill (collapse-all / expand-all) */
  .tree-toggle { display:inline-flex; border:1px solid #2f3540; border-radius:6px; overflow:hidden; background:#181b20; margin-left:4px; }
  .tree-toggle button { background:transparent; border:0; color:#8ea; padding:3px 9px; font-size:12px; line-height:1; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .tree-toggle button + button { border-left:1px solid #2f3540; }
  .tree-toggle button:hover { background:#222831; color:#cfd; }
  .tree-toggle .tt-icon { font-size:10px; opacity:.8; }
  .tree-toggle .tt-label { font-size:11px; color:#bcd; }

  /* right: replica */
  .replica-bar { display:flex; gap:8px; padding:8px 12px; border-bottom:1px solid #2a2d34; align-items:center; }
  .replica-bar .grow { flex:1; }
  .replica-list { padding:6px 8px; }
  .replica-row { display:flex; flex-direction:column; gap:4px; padding:6px 8px; border-bottom:1px solid #23262d; font-size:12px; }
  .replica-row:hover { background:#1f2228; }
  .replica-row.dragging { opacity:.4; }
  .replica-row-head { display:flex; align-items:center; gap:8px; width:100%; }
  .replica-row-controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-left:26px; margin-top:2px; font-size:11px; color:#8aa; }
  .drag-handle { cursor:grab; color:#666; user-select:none; }
  .drag-handle:active { cursor:grabbing; }
  .x-btn { background:transparent; color:#d44; border:0; cursor:pointer; padding:2px 6px; font-size:14px; }
  .x-btn:hover { background:#2a2222; }
  .field-label { font-size:9px; color:#888; text-transform:uppercase; margin-right:2px; }
  .replica-empty { padding:20px; color:#666; font-size:12px; text-align:center; }

  /* hierarchical replica styles */
  .replica-group { background:#1c1f25; border:1px solid #2a2d34; margin-bottom:12px; border-radius:4px; overflow:hidden; }
  .replica-group-head { background:#23262d; padding:8px 12px; font-size:12px; font-weight:bold; color:#9be; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a2d34; }
  .replica-group-body { padding:10px; display:flex; flex-direction:column; gap:10px; }
  .replica-platoon-card { background:#1f2228; border:1px solid #3a3f4a; border-radius:4px; display:flex; flex-direction:column; }
  .replica-platoon-head { background:#282d37; padding:6px 10px; font-size:11px; font-weight:bold; color:#ddd; border-bottom:1px solid #3a3f4a; display:flex; justify-content:space-between; align-items:center; }
  .replica-platoon-units { display:flex; flex-direction:column; padding:4px 0; }
  .replica-platoon-actions { padding:6px 10px; border-top:1px dashed #3a3f4a; display:flex; gap:8px; align-items:center; }
  .group-actions { padding:4px 12px; display:flex; gap:8px; justify-content:flex-start; }

  /* platoon picker */
  .platoon-picker { background:#23262d; border:1px solid #444; min-width:360px; max-width:440px; max-height:60vh; display:flex; flex-direction:column; border-radius:4px; }
  .platoon-picker-head { padding:10px 14px; border-bottom:1px solid #333; font-size:13px; font-weight:bold; cursor:move; user-select:none; }
  .platoon-picker-body { padding:6px 0; overflow-y:auto; flex:1; }
  .platoon-picker-section { padding:4px 14px; font-size:10px; text-transform:uppercase; color:#8aa; letter-spacing:.1em; }
  .platoon-picker-opt { padding:6px 14px; cursor:pointer; font-size:12px; display:flex; gap:8px; align-items:center; }
  .platoon-picker-opt:hover { background:#2d3340; color:#2d4; }
  .platoon-picker-opt .hint { font-size:10px; }
  .platoon-picker-foot { padding:10px 14px; border-top:1px solid #333; display:flex; gap:8px; align-items:center; }
  .platoon-picker-foot input { flex:1; font-size:12px; padding:4px 8px; }

  /* modal */
  .backdrop { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:10; }
  .modal { background:#23262d; border:1px solid #444; min-width:640px; max-width:80vw; max-height:80vh; display:flex; flex-direction:column; border-radius:4px; }
  .modal-head { padding:10px 14px; border-bottom:1px solid #333; display:flex; gap:8px; align-items:center; cursor:move; user-select:none; }
  .modal-head h3 { font-size:13px; margin:0; flex:1; }
  .modal-filters { padding:8px 14px; border-bottom:1px solid #2a2d34; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .modal-body { padding:6px 0; overflow:auto; }
  .modal-foot { padding:10px 14px; border-top:1px solid #333; display:flex; gap:8px; justify-content:flex-end; }

  /* HOW TO rendered markdown */
  .howto-content { color:#dde; font-family: ui-sans-serif, -apple-system, Segoe UI, Roboto, sans-serif; font-size:13px; }
  .howto-content h1 { font-size:18px; color:#fff; border-bottom:1px solid #333; padding-bottom:6px; margin:0 0 14px; }
  .howto-content h2 { font-size:15px; color:#9be; border-bottom:1px solid #2a2d34; padding-bottom:4px; margin:22px 0 10px; }
  .howto-content h3 { font-size:13px; color:#bce; margin:18px 0 8px; }
  .howto-content p { margin:8px 0; }
  .howto-content ul, .howto-content ol { padding-left:22px; margin:8px 0; }
  .howto-content li { margin:3px 0; }
  .howto-content code { background:#1c1f25; color:#e8a13b; padding:1px 5px; border-radius:3px; font-family: ui-monospace, Consolas, Menlo, monospace; font-size:12px; }
  .howto-content pre { background:#1c1f25; border:1px solid #2a2d34; border-radius:4px; padding:10px 12px; overflow-x:auto; margin:10px 0; }
  .howto-content pre code { background:transparent; color:#dde; padding:0; font-size:11.5px; }
  .howto-content a { color:#9be; }
  .howto-content blockquote { border-left:3px solid #e8a13b; background:#1c1f25; margin:10px 0; padding:8px 12px; color:#cce; }
  .howto-content hr { border:none; border-top:1px solid #2a2d34; margin:18px 0; }
  .howto-content table { border-collapse:collapse; margin:10px 0; width:100%; font-size:12px; }
  .howto-content th, .howto-content td { border:1px solid #2a2d34; padding:5px 8px; text-align:left; vertical-align:top; }
  .howto-content th { background:#1c1f25; color:#9be; }
  .howto-content strong { color:#fff; }
  .modal-row { padding:4px 14px; display:grid; grid-template-columns: 36px 1fr 50px 50px 60px 60px; gap:8px; align-items:center; font-size:12px; }
  .modal-row:hover { background:#1f2228; }
  .modal-row img { width:32px; height:22px; object-fit:contain; background:#0c0e12; border:1px solid #23262d; }
  .modal-row img.missing { visibility:hidden; }
  .modal-row .added { background:#2d4; color:#000; padding:1px 6px; border-radius:8px; font-size:10px; }

  /* misc */
  .toast { position:fixed; bottom:16px; right:16px; background:#2d4; color:#000; padding:8px 14px; border-radius:4px; z-index:20; font-size:12px; }
  .toast.err { background:#d44; color:#fff; }
  a.btn-link { background:#3a3f4a; color:#dde; padding:4px 10px; cursor:pointer; border-radius:3px; text-decoration:none; }
  .hint { color:#888; font-size:10px; }

  /* custom searchable select */
  .searchable-select { position:relative; display:inline-block; }
  .searchable-select input { width:150px; font-size:11px; padding:2px 20px 2px 6px; height:22px; cursor:pointer; text-overflow:ellipsis; }
  .searchable-select-dropdown {
    position:absolute;
    top:100%;
    left:0;
    width:100%;
    max-height:150px;
    overflow-y:auto;
    background:#1f2228;
    border:1px solid #444;
    border-top:0;
    z-index:5;
    box-shadow:0 4px 6px rgba(0,0,0,.3);
  }
  .searchable-select-option {

    cursor:pointer;
    font-size:11px;
    white-space:nowrap;
    overflow:hidden;

  .searchable-select-option:hover {

  }
  .searchable-select-option.selected {
    background:#234;
    color:#2d4;
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

// ── state ────────────────────────────────────────────────────────────────────
const NATIONS = ["US","RFA","UK","FR","BEL","NL","DNR","SOV","RUS","RDA","POL","TCH","ESP","CAN"];
const ROLES = ["all","armor","ifv","helicopter","plane","infantry","artillery","aa","recon","supply","engineer","command"];

const state = {
  view: "picker",          // "picker" | "session"
  sessions: [],
  campaigns: [],
  activeSlug: null,
  session: null,           // current session object
  decks: [],               // [{name, pack_count, has_replica, ...}]
  activeDeck: null,
  vanilla: null,           // {combat_groups: [...]}
  replicaGroups: [],       // hierarchical: [{name, platoons: [{name, units: [{unit_id, xp, count, ...}]}]}]
  replicaDirty: false,
  sessionDirty: false,
  initialReplica: "",      // JSON snapshot to detect dirty
  initialScope: [],
  modalOpen: false,
  modalUnits: [],
  modalFilters: { nation: "", role: "all", q: "", source: "all" },
  modalTarget: null,       // {groupIdx, platoonIdx} — where to add units from modal
  exportOpen: false,
  platoonPickerOpen: false, // show platoon name picker modal
  platoonPickerGroupIdx: null,
  platoonPickerRenamePi: null,
  cloneReplicaOpen: false,
  cloneReplicaSource: null,
  cloneReplicaTargets: new Set(),
  settingsOpen: false,     // show settings modal
  buildOpen: false,        // show build log modal
  buildLog: "",
  buildStatus: "",
  howtoOpen: false,        // show end-to-end guide modal
  howtoText: null,         // cached HOWTO.md text after first fetch
  howtoLoading: false,
  unitsIndex: {},          // {unit_id: {display_name, attack, defense, role, nation, xp_bonus, specialties, button_texture, display_resolved}}
  deckQuery: "",
  vanillaCollapsedGroups: new Set(),
  vanillaCollapsedSmartGroups: new Set(),
  replicaCollapsedGroups: new Set(),
  replicaCollapsedPlatoons: new Set(),
};

const $ = sel => document.querySelector(sel);
const el = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const k in attrs || {}) {
    if (k === "class") e.className = attrs[k];
    else if (k === "html") e.innerHTML = attrs[k];
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === false || attrs[k] == null) {}
    else if (attrs[k] === true) e.setAttribute(k, "");
    else e.setAttribute(k, attrs[k]);
  }
  for (const k of kids.flat()) {
    if (k == null || k === false) continue;
    e.appendChild(typeof k === "string" ? document.createTextNode(k) : k);
  }
  return e;
};

let toastTimer;
const toast = (msg, isError) => {
  const t = el("div", { class: "toast" + (isError ? " err" : "") }, msg);
  document.body.appendChild(t);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.remove(), 2400);
};

const api = async (method, path, body) => {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers["content-type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  const r = await fetch("/api" + path, opts);
  if (!r.ok) {
    let detail = ""; try { detail = (await r.json()).error || ""; } catch {}
    throw new Error(detail || r.statusText);
  }
  if (r.headers.get("content-type")?.includes("zip")) return r.blob();
  return r.json();
};

const downloadBlob = (blob, name) => {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
};

const deckShort = name => name.replace("Descriptor_Deck_pion_", "");
const unitShort = name => (name || "").replace(/^WF_/, "").replace(/_/g, " ");

// Display name for a unit id: prefer resolved CSV name, fall back to pretty id.
const unitDisplay = id => {
  if (!id) return "";
  const u = state.unitsIndex[id];
  if (u && u.display_name && u.display_resolved) return u.display_name;
  if (u && u.display_name) return u.display_name;
  return unitShort(id);
};
const unitResolved = id => !!(state.unitsIndex[id] && state.unitsIndex[id].display_resolved);

// Mirror of src/wif_ag_tool/role_normalize.py::normalize_role — both must agree
// so the badge/icon a row paints matches the bucket the filter dropdown selects.
const getNormalizedRole = u => {
  if (!u) return "unknown";
  const r = (u.role || "").toLowerCase().trim();
  if (!r) return "unknown";
  if (r.includes("helo") || r.includes("heli")) return "helicopter";
  if (r === "hq_tank" || r === "armor" || r.includes("tank")) return "armor";
  if (["howitzer","mlrs","mortar"].includes(r) || r.startsWith("art")) return "artillery";
  if (r === "aa" || r.startsWith("sam") || r.includes("spaag") || r.includes("missile") || r.includes("manpads")) return "aa";
  if (["plane","jet","fighter","bomber","aircraft","sead","uav"].includes(r)) return "plane";
  if (r === "reco" || r.includes("recon")) return "recon";
  if (r === "ifv" || r.startsWith("transport") || ["apc","carrier","hq_veh"].includes(r)) return "ifv";
  if (r.includes("engineer") || r.includes("sapper")) return "engineer";
  if (r === "infantry" || r === "at" || r.startsWith("hq_inf")
      || r.includes("rifles") || r.includes("chasseur") || r.includes("commando")
      || r.includes("scout") || r.startsWith("inf")) return "infantry";
  if (r === "supply" || r === "appui" || r.includes("truck") || r.includes("ammo")) return "supply";
  return "unknown";
};

// `command` is a cross-cutting bucket: any hq_* raw role qualifies, regardless
// of its primary bucket (hq_tank is both armor AND command).
const isCommandRole = u => {
  const r = (u && (u.role || "")).toLowerCase().trim();
  return r.startsWith("hq_") || r === "hq";
};

function getFriendlyCGName(name) {
  if (!name) return "";
  if (name.includes("_WIF_") || name.includes("WIF_")) {
    const match = name.match(/WIF_([A-Za-z0-9_]+)/);
    if (match) {
      return `WIF — ${match[1].toUpperCase()}`;
    }
  }
  let clean = name.replace("Descriptor_CombatGroup_pion_", "").replace("Descriptor_CombatGroup_", "");
  if (state.activeDeck) {
    const deckShort = state.activeDeck.replace("Descriptor_Deck_pion_", "");
    const baseDeck = deckShort.replace(/_\d+$/, "");
    if (clean.startsWith(deckShort + "_")) {
      clean = clean.slice(deckShort.length + 1);
    } else if (clean.startsWith(baseDeck + "_")) {
      clean = clean.slice(baseDeck.length + 1);
    }
  }
  let parts = clean.split("_");
  if (parts.length > 1) {
    const first = parts[0];
    const rest = parts.slice(1).join(" ");
    return `${first}-${rest}`.toUpperCase();
  }
  return clean.toUpperCase();
}

function getAvailableGroups() {
  if (!state.vanilla || !state.vanilla.combat_groups) {
    return ["A", "B", "C", "HQ"];
  }
  const groups = [];
  const deckShort = state.activeDeck.replace("Descriptor_Deck_pion_", "");
  const baseDeck = deckShort.replace(/_\d+$/, "");
  for (const cg of state.vanilla.combat_groups) {
    let clean = cg.name.replace("Descriptor_CombatGroup_pion_", "").replace("Descriptor_CombatGroup_", "");
    if (clean.startsWith(deckShort + "_")) {
      clean = clean.slice(deckShort.length + 1);
    } else if (clean.startsWith(baseDeck + "_")) {
      clean = clean.slice(baseDeck.length + 1);
    }
    const part = clean.split("_")[0];
    if (part && !groups.includes(part)) {
      groups.push(part);
    }
  }
  if (groups.length === 0) {
    return ["A", "B", "C", "HQ"];
  }
  return groups;
}

const FOOT_TEAM_ROLES = new Set([
  "at", "atgm", "manpads", "sam_inf", "aa_inf",
  "mortar", "mortar_inf", "mortar_team",
  "hmg", "mmg", "mg_team", "sniper",
  "spotter", "fo", "forward_observer",
  "support_inf", "supp_inf", "sapper",
]);

function needsTransport(u) {
  if (!u) return false;
  const nameLower = (u.name || "").toLowerCase();
  
  // Exclude self-propelled vehicle platforms
  const VEHICLE_KEYWORDS = /m109|m110|2s1|2s3|2s5|2s7|2s19|amx|as90|automoteur|dana|caesar|pzh|archer|bereg|gvozdika|akatsiya|malka|pion|tyulpan|giatsint|vab|bdx|m106|m125|fv432|lav_m|btr|mtlb|stryker|vbmr|hosta|vena|drok|panzermorser|pm_81|pram|vlra|bmr|luchs|fuchs|tuto|m113|humvee|m1025|uaz|jeep|rover|iltis|fuch|m151|bmd|gtmu|ot_62|ot_810|lav|unimog|gaz|truck/i;
  if (VEHICLE_KEYWORDS.test(nameLower)) return false;

  const norm = getNormalizedRole(u);
  if (norm === "infantry" || norm === "engineer") return true;
  const raw = (u.role || "").toLowerCase();
  if (FOOT_TEAM_ROLES.has(raw)) return true;
  // Compound names — Javelin / MANPADS / mortar teams that include descriptive suffixes
  if (/atgm|antitank|at_team|at_inf|manpads|sam_inf|missile_team|javelin|stinger|tow_team|panzerfaust|rpg|hmg_team|mmg_team|mortar_inf|mortar_team|sniper_team|spotter|commandos|sapper/.test(nameLower)) return true;
  // Recon role covers BOTH foot recon (CEWI, Scouts, LRRP, Rangers) and vehicle/heli recon (Bradley CFV, etc.).
  // Use button_texture + name signature to flip only the foot variants.
  if (norm === "recon") {
    const sig = ((u.button_texture || "") + " " + (u.name || "")).toLowerCase();
    if (/scout|lrrp|cewi|ranger|commando|sniper|spotter|spez|reco_inf|recon_inf|spahtrupp|fernspaher/.test(sig)) return true;
  }
  // Towed Howitzers / Artillery
  if (norm === "artillery" || raw === "howitzer") {
    if (/howz|fh70|obusier|2a36|bs3|zis3|trf1|m777|lg1|mstab|msta_b/.test(nameLower)) return true;
  }
  // Towed AA Guns
  if (norm === "aa" || raw === "aa") {
    if (/zu_23|fk20/.test(nameLower)) return true;
  }
  // Towed AT Guns / Recoilless Rifles
  if (norm === "at" || raw === "at") {
    if (/t12_rapira|zis2|vz52|rcl|wombat|spg9|m40a1/.test(nameLower)) return true;
  }
  return false;
}

function getAvailableTransports(unit_id) {
  if (!unit_id) return [];
  const mainUnit = state.unitsIndex[unit_id];
  if (!mainUnit) return [];
  const un = mainUnit.nation;
  if (!un) return [];
  const matchNation = (unation, targetNation) => {
    if (unation === targetNation) return true;
    if (unation === "DDR" && targetNation === "RDA") return true;
    if (unation === "RDA" && targetNation === "DDR") return true;
    return false;
  };
  const list = [];
  const isTransportSpec = s => /^_?transport\d*$/i.test(s || "");
  for (const id in state.unitsIndex) {
    const u = state.unitsIndex[id];
    if (!matchNation(u.nation, un)) continue;
    const roleOk = ["ifv", "supply", "helicopter"].includes(getNormalizedRole(u));
    const specOk = Array.isArray(u.specialties) && u.specialties.some(isTransportSpec);
    if (roleOk || specOk) list.push(u);
  }
  list.sort((a, b) => (a.display_name || a.name).localeCompare(b.display_name || b.name));
  return list;
}

function renderSpecialtyBadges(specialties, role) {
  const list = [...(specialties || [])];
  const hasReconSpec = list.some(s => {
    const clean = s.startsWith('_') ? s.slice(1).toLowerCase() : s.toLowerCase();
    return clean === "recon" || clean === "scout";
  });
  if (role && (role.toLowerCase() === "reco" || role.toLowerCase() === "recon") && !hasReconSpec) {
    list.unshift("Recon");
  }

  if (!list.length) return null;
  const container = el("span", { style: "display: inline-flex; gap: 4px; margin-left: 6px; align-items: center; vertical-align: middle; flex-wrap: wrap;" });
  for (const s of list) {
    const clean = s.startsWith('_') ? s.slice(1) : s;
    const lower = clean.toLowerCase();

    let bg = "#444";
    let color = "#fff";
    let label = clean;

    if (lower === "recon" || lower === "scout") {
      bg = "#1e4620";
      color = "#4ade80";
      label = "RECON";
    } else if (lower === "infiltration") {
      bg = "#78350f";
      color = "#fcd34d";
      label = "FWD";
    } else if (lower === "leader" || lower === "command") {
      bg = "#1e3a8a";
      color = "#60a5fa";
      label = "CMD";
    } else if (lower === "paratrooper" || lower === "airborne") {
      bg = "#4c1d95";
      color = "#c084fc";
      label = "ABN";
    } else if (lower === "amphibious") {
      bg = "#134e5e";
      color = "#2dd4bf";
      label = "AMPH";
    } else if (lower === "resolute") {
      bg = "#7c2d12";
      color = "#fb923c";
      label = "RES";
    } else if (lower === "shock") {
      bg = "#7f1d1d";
      color = "#f87171";
      label = "SHK";
    } else if (lower === "security") {
      bg = "#1e3a8a";
      color = "#93c5fd";
      label = "SEC";
    } else if (lower === "reservist") {
      bg = "#27272a";
      color = "#a1a1aa";
      label = "RSRV";
    } else if (lower === "smoke_launcher") {
      bg = "#3f3f46";
      color = "#d4d4d8";
      label = "SMOKE";
    } else if (lower === "eo_dazzler") {
      bg = "#3f3f46";
      color = "#d4d4d8";
      label = "DAZZLER";
    } else if (lower === "thermals" || lower === "thermals2") {
      bg = "#3f3f46";
      color = "#d4d4d8";
      label = "THERMALS";
    } else if (lower === "era") {
      bg = "#3f3f46";
      color = "#d4d4d8";
      label = "ERA";
    } else if (lower === "transport" || lower === "transport2") {
      bg = "#27272a";
      color = "#a1a1aa";
      label = "TRSP";
    } else {
      label = clean.toUpperCase();
    }

    container.appendChild(el("span", {
      title: s,
      style: `background: ${bg}; color: ${color}; font-size: 8px; font-weight: bold; padding: 1px 4px; border-radius: 3px; letter-spacing: 0.05em; line-height: 1; display: inline-block;`
    }, label));
  }
  return container;
}

// Render a unit-bearing line with thumbnail + display name. Adds data-unit-id so the
// global tooltip handler can find it. Extra is appended after the name (e.g. count, xp).
function unitLine(unit_id, extras) {
  const u = state.unitsIndex[unit_id];
  const role = getNormalizedRole(u);
  const node = el("span", { class: "unit-line", "data-unit-id": unit_id || "" },
    unit_id ? el("span", { class: `unit-thumb-container role-${role}` },
      el("img", {
        class: "unit-thumb",
        src: `/api/unit_icon/${unit_id}`,
        loading: "lazy",
        onerror: e => { e.target.style.display = "none"; },
      })
    ) : null,
    el("span", { class: "name" }, unitDisplay(unit_id)),
    unit_id && !unitResolved(unit_id)
      ? el("span", { class: "warn-mark", title: "Localisation token missing" }, "⚠") : null,
    u ? renderSpecialtyBadges(u.specialties, u.role) : null,
    ...(extras || []),
  );
  return node;
}

// ── collapse-state persistence ──────────────────────────────────────────────
const COLLAPSE_KEY = "wif_ag_collapse_v1";
function loadCollapseState() {
  try {
    const raw = localStorage.getItem(COLLAPSE_KEY);
    if (!raw) return;
    const d = JSON.parse(raw);
    if (Array.isArray(d.vg)) state.vanillaCollapsedGroups = new Set(d.vg);
    if (Array.isArray(d.vsg)) state.vanillaCollapsedSmartGroups = new Set(d.vsg);
    if (Array.isArray(d.rg)) state.replicaCollapsedGroups = new Set(d.rg);
    if (Array.isArray(d.rp)) state.replicaCollapsedPlatoons = new Set(d.rp);
  } catch (e) { /* ignore */ }
}
function saveCollapseState() {
  try {
    localStorage.setItem(COLLAPSE_KEY, JSON.stringify({
      vg: [...state.vanillaCollapsedGroups],
      vsg: [...state.vanillaCollapsedSmartGroups],
      rg: [...state.replicaCollapsedGroups],
      rp: [...state.replicaCollapsedPlatoons],
    }));
  } catch (e) { /* ignore */ }
}

// ── render ───────────────────────────────────────────────────────────────────
function render() {
  const root = $("#root");
  const activeId = document.activeElement?.id;
  const selStart = document.activeElement?.selectionStart;
  const selEnd = document.activeElement?.selectionEnd;

  root.innerHTML = "";
  root.appendChild(state.view === "picker" ? renderPicker() : renderSession());
  if (state.modalOpen) root.appendChild(renderModal());
  if (state.exportOpen) root.appendChild(renderExportDialog());
  if (state.platoonPickerOpen) root.appendChild(renderPlatoonPicker());
  if (state.cloneReplicaOpen) root.appendChild(renderCloneReplicaModal());
  if (state.settingsOpen) root.appendChild(renderSettingsModal());
  if (state.buildOpen) root.appendChild(renderBuildModal());
  if (state.howtoOpen) root.appendChild(renderHowtoModal());

  if (activeId) {
    const activeEl = document.getElementById(activeId);
    if (activeEl) {
      activeEl.focus();
      if (selStart !== undefined && selStart !== null) {
        try { activeEl.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }
  saveCollapseState();
}

function renderPicker() {
  const wrap = el("div");
  wrap.appendChild(el("header", {},
    el("h1", {}, "🎮 WIF AG Tool"),
    el("span", { class: "chip" }, "campaign picker"),
    el("span", { class: "spacer" }),
    el("button", { class: "ghost", onclick: openHowto, title: "End-to-end guide: create a mod, build replicas, export & build" }, "❓ How to"),
  ));

  const body = el("div", { class: "picker" });

  body.appendChild(el("h2", {}, "Resume session"));
  if (state.sessions.length === 0) {
    body.appendChild(el("div", { class: "card" }, el("span", { class: "hint" }, "No sessions yet.")));
  } else {
    for (const s of state.sessions) {
      const card = el("div", { class: "card" },
        el("div", { class: "grow" },
          el("div", { class: "title" }, s.campaign),
          el("div", { class: "meta" },
            `factions: ${(s.factions_from_save || []).join(", ") || "—"}  ·  scope: ${(s.nation_scope || []).join(", ") || "—"}  ·  updated ${s.updated_at?.slice(0, 16) || "?"}`),
        ),
        el("button", { onclick: () => openSession(s.slug) }, "Open"),
        el("button", { class: "del", onclick: () => deleteSession(s.slug) }, "Delete"),
      );
      body.appendChild(card);
    }
  }

  body.appendChild(el("h2", {}, "Discovered campaigns"));
  if (state.campaigns.length === 0) {
    body.appendChild(el("div", { class: "card" }, el("span", { class: "hint" }, "No .sav3 saves found in saves directory.")));
  } else {
    for (const c of state.campaigns) {
      const card = el("div", { class: "card" },
        el("div", { class: "grow" },
          el("div", { class: "title" }, c.campaign),
          el("div", { class: "meta" },
            `${c.save_count} save(s)  ·  factions: ${c.factions_from_save.join(", ")}  ·  missions: ${(c.missions_seen.join(", ") || "—")}`),
        ),
        el("button", { onclick: () => openOrCreateForCampaign(c) }, "Open"),
      );
      body.appendChild(card);
    }
  }

  body.appendChild(el("div", { class: "new" },
    el("button", { class: "warn", onclick: promptNewSession }, "+ New session (manual)"),
  ));

  wrap.appendChild(body);
  return wrap;
}

function renderSession() {
  const s = state.session;
  const wrap = el("div");
  wrap.appendChild(el("header", {},
    el("button", { class: "ghost", onclick: backToPicker }, "← Campaigns"),
    el("h1", {}, s.campaign),
    el("span", { class: "chip" }, (s.factions_from_save || []).join(" / ") || "—"),
    el("span", { class: "spacer" }),
    el("button", { class: "ghost", onclick: openHowto, title: "End-to-end guide: create a mod, build replicas, export & build" }, "❓ How to"),
    el("button", { class: "ghost", onclick: () => { state.settingsOpen = true; render(); }, title: "Configure mod and game folders" }, "⚙ Settings"),
    el("button", { class: "ghost", disabled: !s.target_mod_dir, onclick: doDirectExport, title: s.target_mod_dir ? "Export NDF/CSV files directly to mod workspace" : "Please configure WIF Mod Folder in Settings" }, "📥 Export Mod"),
    el("button", { class: "warn", disabled: !s.target_mod_dir, onclick: doBuildMod, title: s.target_mod_dir ? "Compile the mod using GenerateMod.bat" : "Please configure WIF Mod Folder in Settings" }, "⚡ Build Mod"),
    el("button", { class: "ghost", onclick: doRefreshDecks, title: "Re-parse vanilla NDF after a game patch" }, "Refresh decks"),
    el("button", {
      class: (state.sessionDirty || state.replicaDirty) ? "" : "ghost",
      disabled: !(state.sessionDirty || state.replicaDirty),
      onclick: doSaveSession,
      title: "Save campaign settings and active deck replica changes"
    }, "Save session"),
    el("button", { class: "ghost", onclick: doExtractSession }, "Extract session"),
    el("button", { onclick: () => { state.exportOpen = true; render(); } }, "Export NDF"),
  ));

  const grid = el("div", { class: "session" });
  grid.appendChild(renderLeftPane());
  grid.appendChild(renderCenterPane());
  grid.appendChild(renderRightPane());
  wrap.appendChild(grid);
  return wrap;
}

// ── left pane ───────────────────────────────────────────────────────────────
function renderLeftPane() {
  const scope = new Set(state.session.nation_scope || []);
  const pane = el("section", { class: "pane" });
  pane.appendChild(el("h2", {}, "Nations in scope"));
  const grid = el("div", { class: "nation-list pad" });
  for (const n of NATIONS) {
    const lbl = el("label", {},
      el("input", { type: "checkbox", checked: scope.has(n) || false,
        onchange: e => toggleNation(n, e.target.checked) }),
      n,
    );
    grid.appendChild(lbl);
  }
  pane.appendChild(grid);

  pane.appendChild(el("div", { class: "pad", style: "border-bottom:1px solid #2a2d34; display:flex; gap:6px; align-items:center;" },
    el("span", { class: "field-label" }, "🔍"),
    el("input", {
      id: "deck-search-input",
      type: "text",
      placeholder: "search decks...",
      value: state.deckQuery || "",
      style: "width: 100%; font-size: 11px; padding: 4px 8px;",
      oninput: e => { state.deckQuery = e.target.value; render(); }
    })
  ));

  const query = (state.deckQuery || "").toLowerCase().trim();
  const filteredDecks = state.decks.filter(d => {
    const display = (d.display_name || "").toLowerCase();
    const name = d.name.toLowerCase();
    const short = (d.short || "").toLowerCase();
    return !query || display.includes(query) || name.includes(query) || short.includes(query);
  });

  pane.appendChild(el("h2", {}, `Decks (${filteredDecks.length})`));
  const list = el("div");
  for (const d of filteredDecks) {
    const display = d.display_name || deckShort(d.name);
    const subtitle = `${d.short || deckShort(d.name)} · ${d.pack_count}p`;
    const row = el("div", { class: "deck-row" + (d.name === state.activeDeck ? " active" : ""),
      onclick: () => selectDeck(d.name) },
      el("div", { class: "deck-label" },
        el("span", { class: "deck-name" },
          display,
          d.resolved === false
            ? el("span", { class: "warn-mark", title: "Division name token missing" }, "⚠") : null,
        ),
        el("span", { class: "deck-sub" }, subtitle),
      ),
      d.has_replica ? el("span", { class: "badge" }, `WIF·${d.replica_unit_count}`) : null,
      d.has_replica ? el("span", { class: "ghost-x", title: "Clone WIF replica to other deck(s)",
        onclick: e => { e.stopPropagation(); openCloneReplicaModal(d.name); } }, "⎘") : null,
      d.has_replica ? el("span", { class: "ghost-x", title: "delete WIF replica",
        onclick: e => { e.stopPropagation(); deleteReplica(d.name); } }, "✕") : null,
    );
    list.appendChild(row);
  }
  if (filteredDecks.length === 0) {
    list.appendChild(el("div", { class: "pad hint" }, state.decks.length === 0 ? "Tick nations to populate this list." : "No matching decks found."));
  }
  pane.appendChild(list);
  return pane;
}

// ── collapse/expand-all helpers ─────────────────────────────────────────────
function vanillaCollapseAll() {
  const v = state.vanilla;
  if (!v || !v.combat_groups) return;
  for (const cg of v.combat_groups) {
    state.vanillaCollapsedGroups.add(`${state.activeSlug}::${cg.name}`);
    for (const sg of cg.smart_groups) {
      state.vanillaCollapsedSmartGroups.add(`${state.activeSlug}::${cg.name}::${sg.name}`);
    }
  }
  render();
}
function vanillaExpandAll() {
  const v = state.vanilla;
  if (!v || !v.combat_groups) return;
  for (const cg of v.combat_groups) {
    state.vanillaCollapsedGroups.delete(`${state.activeSlug}::${cg.name}`);
    for (const sg of cg.smart_groups) {
      state.vanillaCollapsedSmartGroups.delete(`${state.activeSlug}::${cg.name}::${sg.name}`);
    }
  }
  render();
}
function replicaCollapseAll() {
  state.replicaGroups.forEach((g, gi) => {
    state.replicaCollapsedGroups.add(`${state.activeSlug}::group::${gi}`);
    g.platoons.forEach((p, pi) => {
      state.replicaCollapsedPlatoons.add(`${state.activeSlug}::group::${gi}::platoon::${pi}`);
    });
  });
  render();
}
function replicaExpandAll() {
  state.replicaGroups.forEach((g, gi) => {
    state.replicaCollapsedGroups.delete(`${state.activeSlug}::group::${gi}`);
    g.platoons.forEach((p, pi) => {
      state.replicaCollapsedPlatoons.delete(`${state.activeSlug}::group::${gi}::platoon::${pi}`);
    });
  });
  render();
}

// ── center pane ─────────────────────────────────────────────────────────────
function renderCenterPane() {
  const pane = el("section", { class: "pane" });
  const v = state.vanilla;
  const heading = state.activeDeck
    ? (v && v.display_name ? `Vanilla — ${v.display_name}` : `Vanilla — ${deckShort(state.activeDeck)}`)
    : "Vanilla deck (select a deck)";
  pane.appendChild(el("h2", {}, heading));
  if (!v) {
    pane.appendChild(el("div", { class: "pad hint" }, state.activeDeck ? "Loading…" : "Pick a deck on the left."));
    return pane;
  }
  pane.appendChild(el("div", { class: "replica-bar" },
    el("span", { class: "tree-toggle" },
      el("button", { title: "Collapse all", onclick: vanillaCollapseAll },
        el("span", { class: "tt-icon" }, "▸"), el("span", { class: "tt-label" }, "Collapse")),
      el("button", { title: "Expand all", onclick: vanillaExpandAll },
        el("span", { class: "tt-icon" }, "▾"), el("span", { class: "tt-label" }, "Expand")),
    ),
  ));
  for (const cg of v.combat_groups) {
    const cgKey = `${state.activeSlug}::${cg.name}`;
    const cgCollapsed = state.vanillaCollapsedGroups.has(cgKey);

    const block = el("div", { class: "cg" });
    const cgHead = el("div", {
      class: "cg-head",
      style: "cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px;",
      onclick: () => {
        if (cgCollapsed) {
          state.vanillaCollapsedGroups.delete(cgKey);
        } else {
          state.vanillaCollapsedGroups.add(cgKey);
        }
        render();
      }
    },
      el("span", { style: "font-size: 8px; color: #778; width: 10px; display: inline-block;" }, cgCollapsed ? "▶" : "▼"),
      el("span", {}, getFriendlyCGName(cg.name)),
      cg.smart_groups.some(s => s.is_hq) ? el("span", { class: "hq" }, "HQ") : null,
    );
    block.appendChild(cgHead);

    if (!cgCollapsed) {
      for (const sg of cg.smart_groups) {
        const sgKey = `${state.activeSlug}::${cg.name}::${sg.name}`;
        const sgCollapsed = state.vanillaCollapsedSmartGroups.has(sgKey);

        const sgEl = el("div", { class: "sg" });
        const expandIcon = sgCollapsed ? "▶ " : "▼ ";
        const sgLabel = sg.display_name && sg.display_name !== sg.name
          ? `${expandIcon}${sg.display_name}`
          : (sg.is_hq ? `${expandIcon}HQ slot` : `${expandIcon}slot`);

        const sgHead = el("div", {
          class: "sg-head",
          style: "cursor: pointer; user-select: none;",
          onclick: () => {
            if (sgCollapsed) {
              state.vanillaCollapsedSmartGroups.delete(sgKey);
            } else {
              state.vanillaCollapsedSmartGroups.add(sgKey);
            }
            render();
          }
        }, sgLabel);
        sgEl.appendChild(sgHead);

        if (!sgCollapsed) {
          for (const p of sg.packs) {
            const row = el("div", { class: "pk" });
            row.appendChild(el("span", { class: "hint" }, `[${p.index}] `));
            if (p.unit) {
              row.appendChild(unitLine(p.unit, [
                el("span", { class: "x" }, ` ×${p.count}`),
                p.xp ? el("span", { class: "hint" }, ` XP${p.xp}`) : null,
              ]));
              if (p.transport) {
                const trspRow = el("div", {
                  style: "margin-left: 20px; margin-top: 2.5px; font-size: 10px; color: #8aa; display: flex; align-items: center; gap: 4px;"
                });
                trspRow.appendChild(el("span", { style: "color: #555; font-family: monospace;" }, "└─ carried in:"));
                trspRow.appendChild(unitLine(p.transport, []));
                row.appendChild(trspRow);
              }
            } else {
              row.appendChild(el("span", {}, "(pack missing)"));
            }
            sgEl.appendChild(row);
          }
        }
        block.appendChild(sgEl);
      }
    }
    pane.appendChild(block);
  }
  return pane;
}

// ── right pane ──────────────────────────────────────────────────────────────
function countTotalUnits() {
  let n = 0;
  for (const g of state.replicaGroups) {
    for (const p of g.platoons) {
      n += p.units.length;
    }
  }
  return n;
}

function renderRightPane() {
  const pane = el("section", { class: "pane" });
  pane.appendChild(el("h2", {}, state.activeDeck ? `WIF replica — ${deckShort(state.activeDeck)}` : "WIF replica"));
  if (!state.activeDeck) {
    pane.appendChild(el("div", { class: "pad hint" }, "Pick a deck on the left."));
    return pane;
  }

  const totalUnits = countTotalUnits();
  pane.appendChild(el("div", { class: "replica-bar" },
    el("button", { onclick: addCombatGroup }, "+ Add Group"),
    el("button", {
      title: "Seed this replica with a full copy of the vanilla deck, then edit it down for balance. The replica IS the deck — only what's here gets exported.",
      onclick: copyVanillaToReplica,
    }, "⧉ Copy vanilla"),
    el("span", { class: "tree-toggle" },
      el("button", { title: "Collapse all", onclick: replicaCollapseAll },
        el("span", { class: "tt-icon" }, "▸"), el("span", { class: "tt-label" }, "Collapse")),
      el("button", { title: "Expand all", onclick: replicaExpandAll },
        el("span", { class: "tt-icon" }, "▾"), el("span", { class: "tt-label" }, "Expand")),
    ),
    el("span", { class: "grow" }),
    el("span", { class: "hint" }, `${totalUnits} unit(s)`),
    el("button", {
      disabled: !state.replicaDirty || totalUnits === 0,
      onclick: saveDeckReplica,
    }, "Save deck"),
  ));

  const list = el("div", { class: "replica-list" });
  if (state.replicaGroups.length === 0) {
    list.appendChild(el("div", { class: "replica-empty" }, "Empty replica. Click + Add Group to start building your deck."));
  }
  state.replicaGroups.forEach((group, gi) => list.appendChild(renderReplicaGroup(group, gi)));
  pane.appendChild(list);
  return pane;
}

function addCombatGroup() {
  const groups = getAvailableGroups();
  const used = new Set(state.replicaGroups.map(g => g.name));
  const available = groups.filter(g => !used.has(g));
  const name = available.length > 0 ? available[0] : prompt("Group name (e.g. A, B, HQ):");
  if (!name) return;
  state.replicaGroups.push({ name, platoons: [] });
  markReplicaDirty();
  render();
}

function copyVanillaToReplica() {
  const v = state.vanilla;
  if (!v || !v.combat_groups || v.combat_groups.length === 0) {
    toast("No vanilla deck data loaded to copy.", true);
    return;
  }
  if (countTotalUnits() > 0 &&
      !confirm("Replace this replica with a full copy of the vanilla deck? Unsaved edits to this replica will be discarded.")) {
    return;
  }

  const letter = (i) => (i < 26 ? String.fromCharCode(65 + i) : `G${i}`);
  const groups = [];
  v.combat_groups.forEach((cg, i) => {
    if (cg.missing) return;
    const platoons = [];
    (cg.smart_groups || []).forEach((sg) => {
      const units = [];
      (sg.packs || []).forEach((p) => {
        if (!p.unit) return;  // pack didn't resolve to a unit — skip
        units.push({
          unit_id: p.unit,
          xp: (p.xp == null ? 1 : p.xp),
          count: (p.count == null ? 1 : p.count),
          attack_override: null,
          defense_override: null,
          transport_id: p.transport || null,
        });
      });
      if (units.length) platoons.push({ name: sg.display_name || sg.name, units });
    });
    if (platoons.length) groups.push({ name: letter(i), platoons });
  });

  if (groups.length === 0) {
    toast("Vanilla deck had no resolvable units to copy.", true);
    return;
  }
  state.replicaGroups = groups;
  markReplicaDirty();
  render();
  toast(`Copied ${groups.length} combat group(s) from vanilla — edit down, then Save deck.`);
}

function copyCombatGroup(gi) {
  const src = state.replicaGroups[gi];
  if (!src) return;
  const clone = JSON.parse(JSON.stringify(src));
  const used = new Set(state.replicaGroups.map(g => g.name));
  const vanilla = getAvailableGroups().filter(n => !used.has(n));
  if (vanilla.length) {
    clone.name = vanilla[0];
  } else {
    let n = 1, candidate;
    do { candidate = n === 1 ? `${src.name} (copy)` : `${src.name} (copy ${n})`; n++; }
    while (used.has(candidate));
    clone.name = candidate;
  }
  state.replicaGroups.splice(gi + 1, 0, clone);
  markReplicaDirty();
  render();
}

function copyPlatoon(gi, pi) {
  const group = state.replicaGroups[gi];
  const src = group?.platoons[pi];
  if (!src) return;
  const clone = JSON.parse(JSON.stringify(src));
  const used = new Set(group.platoons.map(p => p.name));
  let n = 1, candidate;
  do { candidate = n === 1 ? `${src.name} (copy)` : `${src.name} (copy ${n})`; n++; }
  while (used.has(candidate));
  clone.name = candidate;
  group.platoons.splice(pi + 1, 0, clone);
  markReplicaDirty();
  render();
}

function addPlatoon(gi) {
  state.platoonPickerOpen = true;
  state.platoonPickerGroupIdx = gi;
  state.platoonPickerRenamePi = null;
  render();
}

function renamePlatoon(gi, pi) {
  state.platoonPickerOpen = true;
  state.platoonPickerGroupIdx = gi;
  state.platoonPickerRenamePi = pi;
  render();
}

function closePlatoonPicker() {
  state.platoonPickerOpen = false;
  state.platoonPickerGroupIdx = null;
  state.platoonPickerRenamePi = null;
  render();
}

function openCloneReplicaModal(sourceDeckName) {
  state.cloneReplicaOpen = true;
  state.cloneReplicaSource = sourceDeckName;
  state.cloneReplicaTargets = new Set();
  render();
}

function closeCloneReplicaModal() {
  state.cloneReplicaOpen = false;
  state.cloneReplicaSource = null;
  state.cloneReplicaTargets = new Set();
  render();
}

async function cloneReplicaTo(targets) {
  if (!targets || !targets.length) return;
  const source = state.cloneReplicaSource;
  if (!source) return;

  // Pull source groups: in-memory if it's the active deck (carries unsaved edits), else fetch.
  let sourceGroups;
  if (source === state.activeDeck) {
    sourceGroups = JSON.parse(JSON.stringify(state.replicaGroups || []));
  } else {
    try {
      const r = await api("GET", `/decks/${source}/replica`);
      sourceGroups = r.groups || [];
    } catch (err) {
      toast(`Failed to load source replica: ${err.message || err}`, true);
      return;
    }
  }

  // Overwrite warning if any target already has a replica.
  const targetsWithReplica = targets.filter(name => {
    const d = state.decks.find(x => x.name === name);
    return d && d.has_replica;
  });
  if (targetsWithReplica.length && !confirm(`Overwrite existing replica in ${targetsWithReplica.length} deck(s)?`)) {
    return;
  }

  let ok = 0, fail = 0;
  for (const target of targets) {
    try {
      await api("PUT", `/decks/${target}/replica`, { groups: JSON.parse(JSON.stringify(sourceGroups)) });
      ok++;
    } catch (err) {
      fail++;
      console.error(`Clone to ${target} failed:`, err);
    }
  }

  toast(fail ? `Cloned to ${ok} deck(s). ${fail} failed.` : `Cloned to ${ok} deck(s).`, fail > 0);
  closeCloneReplicaModal();
  await reloadScopedDecks();
  if (targets.includes(state.activeDeck)) {
    await selectDeck(state.activeDeck);
  }
}

function renderCloneReplicaModal() {
  const source = state.cloneReplicaSource;
  const sourceDeck = state.decks.find(d => d.name === source);
  const sourceLabel = sourceDeck?.display_name || deckShort(source || "");

  // Family = name minus trailing _<digits>; matches "US_11ACR_1" → "US_11ACR".
  const family = (source || "").replace(/_\d+$/, "");
  const candidates = state.decks.filter(d => d.name !== source);
  const sameFamily = candidates.filter(d => family && d.name.startsWith(family + "_"));
  const others     = candidates.filter(d => !family || !d.name.startsWith(family + "_"));

  const backdrop = el("div", { class: "backdrop",
    onclick: e => { if (e.target === backdrop) closeCloneReplicaModal(); } });

  const modal = el("div", { class: "modal" });
  const modalHead = el("div", { class: "modal-head" },
    el("h3", {}, `Clone replica from "${sourceLabel}" to:`),
    el("button", { class: "ghost", onclick: closeCloneReplicaModal }, "Cancel"),
  );
  modal.appendChild(modalHead);
  makeDraggable(modal, modalHead);

  const body = el("div", { class: "modal-body", style: "max-height:60vh;" });

  const renderRow = d => {
    const checked = state.cloneReplicaTargets.has(d.name);
    const cb = el("input", { type: "checkbox" });
    cb.checked = checked;
    cb.onchange = () => {
      if (cb.checked) state.cloneReplicaTargets.add(d.name);
      else state.cloneReplicaTargets.delete(d.name);
      render();
    };
    const label = d.display_name || deckShort(d.name);
    return el("label", { class: "platoon-picker-opt", style: "display:flex; gap:8px; align-items:center; cursor:pointer;" },
      cb,
      el("span", { style: "flex:1;" }, label),
      el("span", { class: "hint" }, d.short || ""),
      d.has_replica ? el("span", { class: "badge", style: "background:#7a3b1a; color:#ffd9a8;" }, `WIF·${d.replica_unit_count} (will overwrite)`) : null,
    );
  };

  if (sameFamily.length) {
    body.appendChild(el("div", { class: "platoon-picker-section" }, "Same family"));
    for (const d of sameFamily) body.appendChild(renderRow(d));
  }
  if (others.length) {
    body.appendChild(el("div", { class: "platoon-picker-section", style: "margin-top:8px;" }, "Other decks"));
    for (const d of others) body.appendChild(renderRow(d));
  }
  if (!candidates.length) {
    body.appendChild(el("div", { class: "pad hint" }, "No other decks available in this scope."));
  }
  modal.appendChild(body);

  const n = state.cloneReplicaTargets.size;
  const cloneBtn = el("button", {
    onclick: () => cloneReplicaTo(Array.from(state.cloneReplicaTargets)),
  }, `Clone to ${n} deck(s)`);
  if (n === 0) cloneBtn.disabled = true;

  modal.appendChild(el("div", { class: "modal-foot" },
    el("span", { class: "hint" }, `${n} target(s) selected`),
    el("span", { class: "spacer" }, ""),
    el("button", { class: "ghost", onclick: closeCloneReplicaModal }, "Cancel"),
    cloneBtn,
  ));

  backdrop.appendChild(modal);
  return backdrop;
}

function commitPlatoon(name) {
  const gi = state.platoonPickerGroupIdx;
  if (gi === null || gi === undefined) return;
  if (!name || !name.trim()) return;
  const pi = state.platoonPickerRenamePi;
  if (pi !== null && pi !== undefined) {
    const platoon = state.replicaGroups[gi]?.platoons[pi];
    if (platoon) platoon.name = name.trim();
  } else {
    state.replicaGroups[gi].platoons.push({ name: name.trim(), units: [] });
  }
  closePlatoonPicker();
  markReplicaDirty();
  render();
}

function getVanillaPlatoonNames() {
  // Extract unique display names from vanilla smart groups
  const names = [];
  const seen = new Set();
  if (state.vanilla && state.vanilla.combat_groups) {
    for (const cg of state.vanilla.combat_groups) {
      for (const sg of cg.smart_groups) {
        // If display_name is different from raw name and is not a 10-char token, use it
        const isRaw = sg.display_name && /^[A-Z]{10}$/.test(sg.display_name);
        const dn = (sg.display_name && sg.display_name !== sg.name && !isRaw)
          ? sg.display_name
          : (sg.is_hq ? "HQ slot" : "Platoon slot");

        if (dn && !seen.has(dn)) {
          seen.add(dn);
          names.push({ name: dn, cgName: getFriendlyCGName(cg.name), isHq: sg.is_hq });
        }
      }
    }
  }
  return names;
}

function renderPlatoonPicker() {
  const gi = state.platoonPickerGroupIdx;
  const renamePi = state.platoonPickerRenamePi;
  const isRename = renamePi !== null && renamePi !== undefined;
  const groupName = state.replicaGroups[gi]?.name || "?";
  const currentName = isRename ? state.replicaGroups[gi]?.platoons[renamePi]?.name : null;
  const existingNames = new Set(
    (state.replicaGroups[gi]?.platoons || [])
      .filter((p, i) => !isRename || i !== renamePi)
      .map(p => p.name)
  );

  const backdrop = el("div", { class: "backdrop",
    onclick: e => { if (e.target === backdrop) closePlatoonPicker(); } });

  const picker = el("div", { class: "platoon-picker" });
  const pickerHead = el("div", { class: "platoon-picker-head" },
    isRename
      ? `Rename platoon "${currentName}"`
      : `Add platoon to Combat Group "${groupName}"`
  );
  picker.appendChild(pickerHead);
  makeDraggable(picker, pickerHead);

  const body = el("div", { class: "platoon-picker-body" });

  // Section 1: Vanilla platoon names from the current deck
  const vanillaNames = getVanillaPlatoonNames();
  if (vanillaNames.length > 0) {
    body.appendChild(el("div", { class: "platoon-picker-section" }, "Vanilla deck platoons"));
    for (const v of vanillaNames) {
      const already = existingNames.has(v.name);
      const opt = el("div", {
        class: "platoon-picker-opt",
        onclick: () => commitPlatoon(v.name),
      },
        el("span", {}, v.name),
        v.isHq ? el("span", { style: "background:#e8a13b; color:#000; padding:0 5px; border-radius:8px; font-size:10px;" }, "HQ") : null,
        el("span", { class: "hint" }, `from ${v.cgName}`),
        already ? el("span", { class: "hint", style: "color:#2d4;" }, "✓ already in group") : null,
      );
      body.appendChild(opt);
    }
  }

  // Section 2: Standard generic names
  body.appendChild(el("div", { class: "platoon-picker-section", style: "margin-top:8px;" }, "Standard names"));
  const stdNames = ["HQ", "1", "2", "3", "SPT"];
  for (const sn of stdNames) {
    const already = existingNames.has(sn);
    body.appendChild(el("div", {
      class: "platoon-picker-opt",
      onclick: () => commitPlatoon(sn),
    },
      el("span", {}, sn),
      already ? el("span", { class: "hint", style: "color:#2d4;" }, "✓ already in group") : null,
    ));
  }

  picker.appendChild(body);

  // Footer: custom name input
  const customInput = el("input", {
    id: "platoon-custom-input",
    type: "text",
    placeholder: "Or type a custom name...",
  });
  picker.appendChild(el("div", { class: "platoon-picker-foot" },
    customInput,
    el("button", {

function renderReplicaRow(row, gi, pi, ui) {
  const units = state.replicaGroups[gi].platoons[pi].units;
  const uInfo = state.unitsIndex[row.unit_id];
  const role = getNormalizedRole(uInfo);

  // Helper to make a vertically aligned label + control block
  const mkControlGroup = (label, control) => el("div", {
    style: "display: flex; flex-direction: column; gap: 2px; align-items: flex-start;"
  },
    el("span", { class: "field-label", style: "font-size: 8px; color: #8aa; text-transform: uppercase;" }, label),
    control
  );

  const node = el("div", {
    class: "replica-row",
    draggable: "true",
    "data-unit-id": row.unit_id,
    ondragstart: e => { e.dataTransfer.setData("text/plain", `u:${gi}:${pi}:${ui}`); node.classList.add("dragging"); e.stopPropagation(); },
    ondragend: () => node.classList.remove("dragging"),
    ondragover: e => { e.preventDefault(); },
    ondrop: e => {
      const raw = e.dataTransfer.getData("text/plain");
      if (!raw.startsWith("u:")) return;
      e.preventDefault();
      e.stopPropagation();
      const parts = raw.slice(2).split(":");
      if (parts.length === 3) {
        const [fgi, fpi, fui] = parts.map(Number);
        if (fgi === gi && fpi === pi && fui !== ui) {
          // Reorder within same platoon
          const moved = units.splice(fui, 1)[0];
          units.splice(ui > fui ? ui - 1 : ui, 0, moved);
        } else if (fgi !== gi || fpi !== pi) {
          // Move between platoons — but only if no existing unit with same id in target platoon
          const srcUnits = state.replicaGroups[fgi].platoons[fpi].units;
          const moving = srcUnits[fui];
          if (units.some(u => u.unit_id === moving.unit_id)) return;
          srcUnits.splice(fui, 1);
          units.splice(ui, 0, moving);
        }
        markReplicaDirty();
        render();
      }
    },
  },
    // Head: drag handle + unit thumbnail/name + delete button
    el("div", { class: "replica-row-head" },
      el("span", { class: "drag-handle" }, "⋮⋮"),
      el("span", { class: "unit-line", style: "flex: 1; min-width: 0;" },
        el("span", { class: `unit-thumb-container role-${role}` },
          el("img", { class: "unit-thumb", src: `/api/unit_icon/${row.unit_id}`,
            loading: "lazy", onerror: e => { e.target.style.display = "none"; } }),
        ),
        el("span", { class: "name", style: "display: flex; align-items: center; flex-wrap: wrap;" },
          unitDisplay(row.unit_id),
          renderSpecialtyBadges(uInfo?.specialties, uInfo?.role)
        ),
        !unitResolved(row.unit_id)
          ? el("span", { class: "warn-mark", title: "Localisation token missing" }, "⚠") : null,
      ),
      el("button", { class: "x-btn", style: "margin-left: auto;", title: "Remove",
        onclick: () => { units.splice(ui, 1); markReplicaDirty(); render(); } }, "✕")
    ),
    // Controls: XP, Count, ATK override, DEF override, Transport (if infantry)
    el("div", { class: "replica-row-controls" },
      mkControlGroup("XP", mkSelect(["1","2","3"], String(row.xp ?? 1), v => { row.xp = parseInt(v, 10); markReplicaDirty(); })),
      mkControlGroup("n", mkInput(row.count ?? 1, 1, v => { row.count = parseInt(v, 10) || 1; markReplicaDirty(); })),
      mkControlGroup("ATK", mkInput(row.attack_override ?? "", null, v => { row.attack_override = v === "" ? null : parseInt(v, 10); markReplicaDirty(); }, "auto")),
      mkControlGroup("DEF", mkInput(row.defense_override ?? "", null, v => { row.defense_override = v === "" ? null : parseInt(v, 10); markReplicaDirty(); }, "auto")),
      needsTransport(uInfo) ? mkControlGroup("Transport", mkSearchableSelect(
        ["(None)", ...getAvailableTransports(row.unit_id).map(t => t.name)],
        row.transport_id || "(None)",
        v => { row.transport_id = v === "(None)" ? null : v; markReplicaDirty(); },
        name => name === "(None)" ? "(None)" : unitDisplay(name)
      )) : null
    )
  );
  return node;
}

const mkSearchableSelect = (opts, val, onchange, labelFn) => {
  const container = el("div", { class: "searchable-select" });
  const valToLabel = new Map();
  const labelToVal = new Map();
  for (const o of opts) {
    const label = labelFn ? labelFn(o) : o;
    valToLabel.set(o, label);
    labelToVal.set(label, o);
  }
  const currentLabel = valToLabel.get(val) || "";

  const input = el("input", {
    type: "text",
    value: currentLabel,
    placeholder: "Search transport...",
    style: "background: #1f2228 url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23888888%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E') no-repeat right 6px center; background-size: 8px auto;",
    onfocus: e => {
      e.target.value = "";
      renderDropdown(e.target.value);
    },
    onblur: e => {
      setTimeout(() => {
        const drop = container.querySelector(".searchable-select-dropdown");
        if (drop) drop.remove();
        input.value = valToLabel.get(val) || "";
      }, 200);
    },
    oninput: e => {
      renderDropdown(e.target.value);
    }
  });
  container.appendChild(input);

  function renderDropdown(filterText) {
    let drop = container.querySelector(".searchable-select-dropdown");
    if (!drop) {
      drop = el("div", { class: "searchable-select-dropdown" });
      container.appendChild(drop);
    }
    drop.innerHTML = "";
    const lowerFilter = (filterText || "").toLowerCase();
    const filteredOpts = opts.filter(o => {
      const label = valToLabel.get(o) || "";
      return label.toLowerCase().includes(lowerFilter);
    });
    if (filteredOpts.length === 0) {
      drop.appendChild(el("div", { class: "searchable-select-option hint", style: "cursor:default; color:#777;" }, "No matches"));
      return;
    }
    for (const o of filteredOpts) {
      const label = valToLabel.get(o) || "";
      const isSelected = o === val;
      const optEl = el("div", {
        class: `searchable-select-option${isSelected ? " selected" : ""}`,
        title: label,
        onmousedown: e => {
          e.preventDefault();
          onchange(o);
          input.value = label;
          drop.remove();
        }
      }, label);
      drop.appendChild(optEl);
    }
  }
  return container;
};

const mkSelect = (opts, val, onchange, labelFn) => {
  const s = el("select", { onchange: e => onchange(e.target.value) });
  for (const o of opts) {
    const label = labelFn ? labelFn(o) : o;
    const opt = el("option", { value: o }, label);
    if (o === val) opt.selected = true;
    s.appendChild(opt);
  }
  return s;
};
const mkInput = (val, min, oninput, placeholder) => el("input", {
  class: "num", type: "number",
  value: val === null || val === undefined ? "" : val,
  min: min === null ? false : min,
  placeholder: placeholder || "",
  oninput: e => oninput(e.target.value),
});

// ── draggable modals (in-memory remembered offset) ─────────────────────────
const lastModalOffset = { x: 0, y: 0 };
function makeDraggable(panel, handle) {
  if (!panel || !handle) return;
  const apply = () => { panel.style.transform = `translate(${lastModalOffset.x}px, ${lastModalOffset.y}px)`; };
  apply();
  handle.addEventListener("mousedown", e => {
    if (e.button !== 0) return;
    if (e.target.closest("button, input, select, textarea, a")) return;
    e.preventDefault();
    const startX = e.clientX, startY = e.clientY;
    const baseX = lastModalOffset.x, baseY = lastModalOffset.y;
    const onMove = ev => {
      lastModalOffset.x = baseX + (ev.clientX - startX);
      lastModalOffset.y = baseY + (ev.clientY - startY);
      apply();
    };
    const onUp = () => {
      document.removeEventListener("mousemove", onMove);
      document.removeEventListener("mouseup", onUp);
    };
    document.addEventListener("mousemove", onMove);
    document.addEventListener("mouseup", onUp);
  });
}

// Minimal markdown → HTML for the subset HOWTO.md actually uses.
// Handles: ATX headings, fenced code blocks, inline code, bold, italic,
// blockquotes, unordered + ordered lists, pipe tables, horizontal rules,
// links, and paragraph wrapping. Not a general-purpose renderer; kept small
// on purpose so the SPA stays dependency-free.
function mdToHtml(md) {
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  const inline = s => {
    // Inline code first so its contents are protected from other rules.
    const codeSlots = [];
    s = s.replace(/`([^`]+)`/g, (_, c) => {
      codeSlots.push(c);
      return `␀${codeSlots.length - 1}␀`;
    });
    s = esc(s);
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`);
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
    s = s.replace(/␀(\d+)␀/g, (_, i) => `<code>${esc(codeSlots[+i])}</code>`);
    return s;
  };

  const lines = md.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  let i = 0;
  let inUl = false, inOl = false;
  const closeLists = () => {
    if (inUl) { out.push("</ul>"); inUl = false; }
    if (inOl) { out.push("</ol>"); inOl = false; }
  };

  while (i < lines.length) {
    const line = lines[i];

    // Fenced code block
    if (/^```/.test(line)) {
      closeLists();
      i++;
      const buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++; // skip closing fence
      out.push(`<pre><code>${esc(buf.join("\n"))}</code></pre>`);
      continue;
    }

    // Horizontal rule
    if (/^---+\s*$/.test(line)) {
      closeLists();
      out.push("<hr>");
      i++;
      continue;
    }

    // Heading
    const h = /^(#{1,6})\s+(.*)$/.exec(line);
    if (h) {
      closeLists();
      out.push(`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`);
      i++;
      continue;
    }

    // Table (GFM-ish: header | header followed by ---|---)
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)+\|?\s*$/.test(lines[i + 1])) {
      closeLists();
      const splitRow = r => r.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(c => c.trim());
      const headers = splitRow(line);
      i += 2; // skip header + separator
      const rows = [];
      while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") {
        rows.push(splitRow(lines[i]));
        i++;
      }
      let html = "<table><thead><tr>" + headers.map(h => `<th>${inline(h)}</th>`).join("") + "</tr></thead><tbody>";
      for (const r of rows) html += "<tr>" + r.map(c => `<td>${inline(c)}</td>`).join("") + "</tr>";
      html += "</tbody></table>";
      out.push(html);
      continue;
    }

    // Blockquote
    if (/^>\s?/.test(line)) {
      closeLists();
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^>\s?/, ""));
        i++;
      }
      out.push(`<blockquote>${inline(buf.join(" "))}</blockquote>`);
      continue;
    }

    // Unordered list item
    const ulm = /^[-*]\s+(.*)$/.exec(line);
    if (ulm) {
      if (inOl) { out.push("</ol>"); inOl = false; }
      if (!inUl) { out.push("<ul>"); inUl = true; }
      out.push(`<li>${inline(ulm[1])}</li>`);
      i++;
      continue;
    }

    // Ordered list item
    const olm = /^\d+\.\s+(.*)$/.exec(line);
    if (olm) {
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (!inOl) { out.push("<ol>"); inOl = true; }
      out.push(`<li>${inline(olm[1])}</li>`);
      i++;
      continue;
    }

    // Blank line: paragraph break
    if (line.trim() === "") {
      closeLists();
      i++;
      continue;
    }

    // Default: paragraph (accumulate until blank line or block-level start)
    closeLists();
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() !== "" &&
           !/^(#{1,6}\s|>\s|[-*]\s|\d+\.\s|```|---+\s*$)/.test(lines[i])) {
      buf.push(lines[i]);
      i++;
    }
    out.push(`<p>${inline(buf.join(" "))}</p>`);
  }
  closeLists();
  return out.join("\n");
}

// ── actions ─────────────────────────────────────────────────────────────────

async function bootstrapPicker() {
  try {
    const [sessions, campaigns] = await Promise.all([
      api("GET", "/sessions"),
      api("GET", "/campaigns"),
    ]);
    state.sessions = sessions;
    state.campaigns = campaigns;
  } catch (e) { toast("Failed to load picker: " + e.message, true); }
  render();
}

async function openSession(slug) {
  try {
    const session = await api("GET", `/sessions/${slug}`);
    state.session = session;
    state.activeSlug = slug;
    state.activeDeck = null;
    state.vanilla = null;
    state.replicaGroups = [];
    state.initialReplica = "[]";
    state.initialScope = [...(session.nation_scope || [])];
    state.replicaDirty = false;
    state.sessionDirty = false;
    state.view = "session";
    loadCollapseState();
    await reloadScopedDecks();
    render();
  } catch (e) { toast("Open failed: " + e.message, true); }
}

async function openOrCreateForCampaign(c) {
  // If a session for this slug already exists, open it; else create new.
  const existing = state.sessions.find(s => s.slug === c.slug);
  if (existing) return openSession(existing.slug);
  try {
    const created = await api("POST", "/sessions", {
      campaign: c.campaign,
      factions: c.factions_from_save,
      missions: c.missions_seen,
      slug: c.slug,
    });
    state.sessions.unshift(created);
    return openSession(created.slug);
  } catch (e) { toast("Create failed: " + e.message, true); }
}

async function promptNewSession() {
  const name = prompt("Campaign name?");
  if (!name) return;
  const factionStr = prompt("Factions (comma-separated, e.g. US,SOV)") || "";
  const factions = factionStr.split(",").map(s => s.trim()).filter(Boolean);
  try {
    const created = await api("POST", "/sessions", { campaign: name, factions });
    state.sessions.unshift(created);
    openSession(created.slug);
  } catch (e) { toast("Create failed: " + e.message, true); }
}

async function deleteSession(slug) {
  if (!confirm("Delete this session? Replicas are kept (they're global).")) return;
  try {
    await api("DELETE", `/sessions/${slug}`);
    state.sessions = state.sessions.filter(s => s.slug !== slug);
    render();
  } catch (e) { toast("Delete failed: " + e.message, true); }
}

function backToPicker() {
  if (state.replicaDirty && !confirm("Unsaved deck edits will be lost. Continue?")) return;
  if (state.sessionDirty && !confirm("Unsaved session changes will be lost. Continue?")) return;
  state.replicaGroups = [];
  state.initialReplica = "[]";
  state.view = "picker";
  state.session = null;
  state.activeSlug = null;
  state.vanillaCollapsedGroups.clear();
  state.vanillaCollapsedSmartGroups.clear();
  state.replicaCollapsedGroups.clear();
  state.replicaCollapsedPlatoons.clear();
  bootstrapPicker();
}

function toggleNation(n, on) {
  const scope = new Set(state.session.nation_scope || []);
  if (on) scope.add(n); else scope.delete(n);
  state.session.nation_scope = Array.from(scope);
  state.sessionDirty = !arraysEq(state.session.nation_scope, state.initialScope);
  reloadScopedDecks();
}

const arraysEq = (a, b) => a.length === b.length && a.every((x, i) => x === b[i]);

async function reloadScopedDecks() {
  try {
    const nations = (state.session.nation_scope || []).join(",");
    state.decks = await api("GET", `/sessions/${state.activeSlug}/decks?nations=${nations}`);
  } catch (e) { toast("Failed to load decks: " + e.message, true); state.decks = []; }
  render();
}

async function selectDeck(name) {
  if (state.replicaDirty && !confirm("Switch deck and lose unsaved WIF edits?")) return;
  state.activeDeck = name;
  state.vanilla = null;
  state.replicaGroups = [];
  state.initialReplica = "[]";
  state.replicaDirty = false;
  render();
  try {
    const [v, r] = await Promise.all([
      api("GET", `/decks/${name}/vanilla`),
      api("GET", `/decks/${name}/replica`),
    ]);
    state.vanilla = v;
    // Load hierarchical groups, falling back to empty
    if (r.groups && r.groups.length > 0) {
      state.replicaGroups = JSON.parse(JSON.stringify(r.groups));
    } else if (r.units && r.units.length > 0) {
      // Legacy flat format — convert on the fly
      const gmap = {};
      for (const u of r.units) {
        const gn = u.group_name || "A";
        const pn = u.sub_group || "Default";
        if (!gmap[gn]) gmap[gn] = {};
        if (!gmap[gn][pn]) gmap[gn][pn] = [];
        gmap[gn][pn].push({ unit_id: u.unit_id, xp: u.xp || 1, count: u.count || 1,
          attack_override: u.attack_override || null, defense_override: u.defense_override || null,
          transport_id: u.transport_id || null });
      }
      state.replicaGroups = Object.keys(gmap).sort().map(gn => ({
        name: gn,
        platoons: Object.keys(gmap[gn]).sort().map(pn => ({ name: pn, units: gmap[gn][pn] }))
      }));
    } else {
      state.replicaGroups = [];
    }
    state.initialReplica = JSON.stringify(state.replicaGroups);
    state.replicaDirty = false;
  } catch (e) { toast("Failed: " + e.message, true); }
  render();
}

function markReplicaDirty() {
  state.replicaDirty = JSON.stringify(state.replicaGroups) !== state.initialReplica;
  render();
}

async function saveDeckReplica() {
  if (countTotalUnits() === 0) { toast("Use the ✕ on the left to delete the replica instead.", true); return; }
  try {
    await api("PUT", `/decks/${state.activeDeck}/replica`, { groups: state.replicaGroups });
    state.initialReplica = JSON.stringify(state.replicaGroups);
    state.replicaDirty = false;
    toast("Replica saved.");
    await reloadScopedDecks();
  } catch (e) { toast("Save failed: " + e.message, true); }
}

async function deleteReplica(deck) {
  if (!confirm("Delete the WIF replica for this deck? Affects every session that references it.")) return;
  try {
    await api("DELETE", `/decks/${deck}/replica`);
    if (state.activeDeck === deck) {
      state.replicaGroups = [];
      state.initialReplica = "[]";
      state.replicaDirty = false;
    }
    await reloadScopedDecks();
    toast("Replica deleted.");
  } catch (e) { toast("Delete failed: " + e.message, true); }
}

async function doSaveSession() {
  try {
    let savedSession = false;
    let savedReplica = false;

    if (state.replicaDirty) {
      if (countTotalUnits() === 0) {
        toast("Cannot save empty replica via Save Session. Use the ✕ on the left to delete it instead.", true);
        return;
      }
      await api("PUT", `/decks/${state.activeDeck}/replica`, { groups: state.replicaGroups });
      state.initialReplica = JSON.stringify(state.replicaGroups);
      state.replicaDirty = false;
      savedReplica = true;
    }

    if (state.sessionDirty) {
      const saved = await api("PATCH", `/sessions/${state.activeSlug}`, {
        nation_scope: state.session.nation_scope,
      });
      state.session = saved;
      state.initialScope = [...(saved.nation_scope || [])];
      state.sessionDirty = false;
      savedSession = true;
    }

    if (savedSession && savedReplica) {
      toast("Session and active deck replica saved.");
    } else if (savedSession) {
      toast("Session saved.");
    } else if (savedReplica) {
      toast("Active deck replica saved.");
    }

    await reloadScopedDecks();
  } catch (e) {
    toast("Save failed: " + e.message, true);
  }
}

async function doExtractSession() {
  try {
    const blob = await api("POST", `/sessions/${state.activeSlug}/extract`);
    downloadBlob(blob, `wif_session_${state.activeSlug}.zip`);
  } catch (e) { toast("Extract failed: " + e.message, true); }
}

async function doRefreshDecks() {
  try {
    await api("POST", "/refresh");
    await reloadScopedDecks();
    toast("Deck cache refreshed.");
  } catch (e) { toast("Refresh failed: " + e.message, true); }
}

async function doExport(scope) {
  try {
    const body = scope === "session"
      ? { scope: "session", session_slug: state.activeSlug }
      : { scope: "all" };
    const blob = await api("POST", "/export", body);
