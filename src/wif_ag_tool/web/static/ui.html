async function doSaveSettings(targetModDir, gameDir, exportDir) {
  const pathsChanged = (targetModDir !== (state.session.target_mod_dir || "")) ||
                       (gameDir !== (state.session.game_dir || "")) ||
                       (exportDir !== (state.session.export_dir || ""));
  try {
    const saved = await api("PATCH", `/sessions/${state.activeSlug}`, {
      target_mod_dir: targetModDir,
      game_dir: gameDir,
      export_dir: exportDir,
    });
    state.session = saved;
    state.settingsOpen = false;
    toast("Settings saved successfully.");
    if (pathsChanged) {
      toast("Paths changed, refreshing catalog...");
      await doRefreshDecks();
    } else {
      render();
    }
  } catch (e) {
    toast("Save settings failed: " + e.message, true);
  }
}

async function doDirectExport() {
  try {
    const res = await api("POST", `/sessions/${state.activeSlug}/export_direct`);
    toast(res.message || "Direct export complete.");
  } catch (e) {
    toast("Export failed: " + e.message, true);
  }
}

async function doBuildMod() {
  state.buildOpen = true;
  state.buildStatus = "building";
  state.buildLog = "Triggering GenerateMod.bat...\n";
  render();

  try {
    const r = await fetch(`/api/sessions/${state.activeSlug}/build`, {
      method: "POST"
    });
    let res;
    try {
      res = await r.json();
    } catch (e) {
      res = { error: "Failed to parse API response: " + r.statusText };
    }

    if (r.ok && res.ok) {
      state.buildStatus = "success";
      let log = "GenerateMod.bat completed successfully.\n\n";
      if (res.stdout) log += "STDOUT:\n" + res.stdout + "\n";
      if (res.stderr) log += "STDERR:\n" + res.stderr + "\n";
      state.buildLog = log;
    } else {
      state.buildStatus = "fail";
      let log = "GenerateMod.bat failed.\n\n";
      if (res.error) log += "ERROR: " + res.error + "\n\n";
      if (res.stdout) log += "STDOUT:\n" + res.stdout + "\n";
      if (res.stderr) log += "STDERR:\n" + res.stderr + "\n";
      state.buildLog = log;
    }
  } catch (err) {
    state.buildStatus = "fail";
    state.buildLog = "Failed to run build: " + err.message;
  }
  render();
}

// ── modal helpers ───────────────────────────────────────────────────────────

// Kept for backwards compatibility — every filter change now re-filters the
// in-memory catalogue, so there's no async work and no debounce needed.
function debounceReload() { reloadModalUnits(); }

async function openAddModal(gi, pi) {
  if (!state.activeDeck) return;
  state.modalOpen = true;
  state.modalTarget = (gi !== undefined && pi !== undefined) ? { groupIdx: gi, platoonIdx: pi } : null;
  const dn = state.activeDeck.split("_")[3];
  // Preserve a previously typed search across modal opens by keeping `q` if it's there.
  const prevQ = state.modalFilters?.q || "";
  state.modalFilters = { nation: dn || "", role: "all", q: prevQ, source: "all" };
  // The catalogue is loaded once at page boot; if it isn't ready yet, fall back to
  // an async load so the first modal open isn't empty.
  if (Object.keys(state.unitsIndex).length === 0) {
    await loadUnitsIndex();
  }
  reloadModalUnits();
  render();
}

// Pure client-side filter against state.unitsIndex. Since the catalogue is fully
// in memory, switching Source (WIF ↔ Vanilla) doesn't reload the unit list — it
// only re-filters the same data — which is why the search box keeps its value
// when you flip the source.
function reloadModalUnits() {
  const f = state.modalFilters;
  const q = (f.q || "").toLowerCase().trim();
  const wantSource = (f.source || "all");
  const wantNation = (f.nation === "RDA") ? "DDR" : f.nation;
  const wantRole = (f.role || "all");
  const matches = [];
  for (const id in state.unitsIndex) {
    const u = state.unitsIndex[id];
    if (wantSource !== "all" && (u.source || "wif") !== wantSource) continue;
    if (wantNation && u.nation !== wantNation) continue;
    if (wantRole !== "all") {
      // "command" is a cross-cutting bucket: any hq_* role qualifies.
      if (wantRole === "command") {
        if (!isCommandRole(u)) continue;
      } else if (getNormalizedRole(u) !== wantRole) {
        continue;
      }
    }
    if (q) {
      const hay = (u.name + " " + (u.display_name || "")).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    matches.push(u);
  }
  matches.sort((a, b) =>
    (a.display_name || a.name).localeCompare(b.display_name || b.name)
  );
  state.modalUnits = matches;
  render();
}

function closeModal() { state.modalOpen = false; render(); }

function addUnitToReplica(u) {
  const target = state.modalTarget;
  if (!target || !state.replicaGroups[target.groupIdx] || !state.replicaGroups[target.groupIdx].platoons[target.platoonIdx]) {
    toast("No platoon selected — add a group and platoon first.", true);
    return;
  }
  state.replicaGroups[target.groupIdx].platoons[target.platoonIdx].units.push({
    unit_id: u.name, xp: 1, count: 1, attack_override: null, defense_override: null,
    transport_id: null,
  });
  markReplicaDirty();
}

// ── units index (WIF + vanilla) ─────────────────────────────────────────────
async function loadUnitsIndex() {
  // Idempotent: only fetch once per page load. Both endpoints return the same shape.
  // The backend tags each unit with `source` ("wif" or "vanilla") so the modal can
  // filter, badge, and search without ever re-hitting the API.
  if (Object.keys(state.unitsIndex).length > 0) return;
  try {
    const [wif, vanilla] = await Promise.all([
      api("GET", "/wif_units"),
      api("GET", "/vanilla_units"),
    ]);
    const ix = {};
    // Vanilla first, WIF second — WIF wins on the (unlikely) name collision.
    for (const u of vanilla) ix[u.name] = u;
    for (const u of wif) ix[u.name] = u;
    state.unitsIndex = ix;
    render();
  } catch (e) {
    toast("Failed to load unit catalogue: " + e.message, true);
  }
}

// ── tooltip ─────────────────────────────────────────────────────────────────
let tooltipEl = null;
let tooltipFor = null;

function ensureTooltip() {
  if (tooltipEl) return tooltipEl;
  tooltipEl = el("div", { id: "unit-tooltip", hidden: true });
  document.body.appendChild(tooltipEl);
  return tooltipEl;
}

function fillTooltip(unit_id) {
  const t = ensureTooltip();
  const u = state.unitsIndex[unit_id];
  t.innerHTML = "";
  if (!u) {
    t.appendChild(el("div", { class: "tt-head" },
      el("div", {},
        el("div", { class: "tt-name" }, unitShort(unit_id)),
        el("div", { class: "tt-id" }, unit_id + " (not in catalogue)"),
      ),
    ));
    return;
  }
  const role = getNormalizedRole(u);
  const head = el("div", { class: "tt-head" },
    el("span", { class: `unit-thumb-container role-${role} large` },
      el("img", { src: `/api/unit_icon/${unit_id}`, onerror: e => { e.target.style.display = "none"; } }),
    ),
    el("div", { style: "flex:1; min-width:0" },
      el("div", { class: "tt-name" },
        u.display_name || unitShort(unit_id),
        u.display_resolved === false ? el("span", { class: "warn-mark", title: "LOC missing" }, " ⚠") : null,
      ),
      el("div", { class: "tt-id" }, unit_id),
    ),
  );
  t.appendChild(head);
  t.appendChild(el("div", { class: "tt-row" },
    el("span", { class: "tt-chip" }, u.nation || "?"),
    el("span", { class: "tt-chip" }, u.role || "?"),
    u.xp_bonus ? el("span", { class: "tt-chip" }, `XP+${u.xp_bonus}/lvl`) : null,
  ));
  t.appendChild(el("div", { class: "tt-row" },
    el("span", { class: "tt-stat" }, "ATK ", el("b", {}, String(u.attack ?? "?"))),
    el("span", { class: "tt-stat" }, "DEF ", el("b", {}, String(u.defense ?? "?"))),
  ));
  if (u.specialties && u.specialties.length) {
    const badges = renderSpecialtyBadges(u.specialties, u.role);
    if (badges) {
      const wrap = el("div", { class: "tt-specs" });
      wrap.appendChild(badges);
      t.appendChild(wrap);
    }
  }
}

function positionTooltip(x, y) {
  const t = ensureTooltip();
  const m = 14;
  const w = t.offsetWidth || 280;
  const h = t.offsetHeight || 120;
  let left = x + m;
  let top = y + m;
  if (left + w > window.innerWidth - 8) left = x - w - m;
  if (top + h > window.innerHeight - 8) top = y - h - m;
  if (left < 4) left = 4;
  if (top < 4) top = 4;
  t.style.left = left + "px";
  t.style.top = top + "px";
}

document.addEventListener("mouseover", e => {
  const target = e.target.closest("[data-unit-id]");
  if (!target) return;
  const id = target.getAttribute("data-unit-id");
  if (!id) return;
  tooltipFor = id;
  fillTooltip(id);
  const t = ensureTooltip();
  t.hidden = false;
  positionTooltip(e.clientX, e.clientY);
  // Two-frame opacity transition so we don't flash an unstyled box.
  requestAnimationFrame(() => t.setAttribute("data-shown", "1"));
});

document.addEventListener("mousemove", e => {
  if (!tooltipFor) return;
  positionTooltip(e.clientX, e.clientY);
});

document.addEventListener("mouseout", e => {
  if (!tooltipFor) return;
  const to = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-unit-id]");
  if (to) return;  // moved between two unit rows — keep the tooltip alive
  tooltipFor = null;
  const t = ensureTooltip();
  t.removeAttribute("data-shown");
  t.hidden = true;
});

// ── init ────────────────────────────────────────────────────────────────────
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && state.platoonPickerOpen) closePlatoonPicker();
  if (e.key === "Escape" && state.cloneReplicaOpen) closeCloneReplicaModal();
  if (e.key === "Escape" && state.modalOpen) closeModal();
  if (e.key === "Escape" && state.exportOpen) { state.exportOpen = false; render(); }
  if (e.key === "Escape" && state.settingsOpen) { state.settingsOpen = false; render(); }
  if (e.key === "Escape" && state.howtoOpen) { state.howtoOpen = false; render(); }
});
window.addEventListener("beforeunload", e => {
  if (state.replicaDirty || state.sessionDirty) { e.preventDefault(); e.returnValue = ""; }
});
window.addEventListener("unload", () => {
  // Clear state to prevent memory leaks
  state.replicaGroups = [];
  state.unitsIndex = {};
});

loadCollapseState();
bootstrapPicker();
loadUnitsIndex();
</script>
</body>
</html>
